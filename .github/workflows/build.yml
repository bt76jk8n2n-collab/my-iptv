          cat > app/src/main/java/com/my/iptv/Store.java <<'EOF'
          package com.my.iptv;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          // كل اللي ينحفظ على التلفزيون: المفضلة، الأقسام المخفية، آخر قناة، أكمل المشاهدة، الإعدادات
          public class Store {
              static SharedPreferences sp(Context c) {
                  return c.getSharedPreferences("state", Context.MODE_PRIVATE);
              }

              static SharedPreferences positions(Context c) {
                  return c.getSharedPreferences("positions", Context.MODE_PRIVATE);
              }

              public static String keyOf(Channel ch) {
                  return ch.url != null && !ch.url.isEmpty() ? ch.url : "series:" + ch.seriesId;
              }

              static JSONObject toJson(Channel ch) throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("name", ch.name == null ? "" : ch.name);
                  o.putOpt("url", ch.url);
                  o.putOpt("altUrl", ch.altUrl);
                  o.putOpt("group", ch.group);
                  o.putOpt("seriesId", ch.seriesId);
                  o.putOpt("logo", ch.logo);
                  o.putOpt("streamId", ch.streamId);
                  return o;
              }

              static String s(JSONObject o, String k) {
                  return o.has(k) && !o.isNull(k) ? o.optString(k) : null;
              }

              static Channel fromJson(JSONObject o) {
                  Channel ch = new Channel();
                  ch.name = o.optString("name", "");
                  ch.url = s(o, "url");
                  ch.altUrl = s(o, "altUrl");
                  ch.group = s(o, "group");
                  ch.seriesId = s(o, "seriesId");
                  ch.logo = s(o, "logo");
                  ch.streamId = s(o, "streamId");
                  return ch;
              }

              static List<Channel> getList(Context c, String key) {
                  List<Channel> out = new ArrayList<>();
                  try {
                      JSONArray a = new JSONArray(sp(c).getString(key, "[]"));
                      for (int i = 0; i < a.length(); i++) out.add(fromJson(a.getJSONObject(i)));
                  } catch (Exception ignored) {
                  }
                  return out;
              }

              static void putList(Context c, String key, List<Channel> list) {
                  JSONArray a = new JSONArray();
                  try {
                      for (Channel ch : list) a.put(toJson(ch));
                  } catch (JSONException ignored) {
                  }
                  sp(c).edit().putString(key, a.toString()).apply();
              }

              static int indexOfKey(List<Channel> list, String key) {
                  for (int i = 0; i < list.size(); i++) if (keyOf(list.get(i)).equals(key)) return i;
                  return -1;
              }

              // ---------- المفضلة ----------
              public static List<Channel> favs(Context c, int sec) {
                  return getList(c, "fav_" + sec);
              }

              public static void addFav(Context c, int sec, Channel ch) {
                  List<Channel> l = favs(c, sec);
                  if (indexOfKey(l, keyOf(ch)) < 0) l.add(ch);
                  putList(c, "fav_" + sec, l);
              }

              public static void removeFav(Context c, int sec, Channel ch) {
                  List<Channel> l = favs(c, sec);
                  int i = indexOfKey(l, keyOf(ch));
                  if (i >= 0) l.remove(i);
                  putList(c, "fav_" + sec, l);
              }

              public static void moveFav(Context c, int sec, int from, int to) {
                  List<Channel> l = favs(c, sec);
                  if (from < 0 || from >= l.size() || to < 0 || to >= l.size()) return;
                  Channel x = l.remove(from);
                  l.add(to, x);
                  putList(c, "fav_" + sec, l);
              }

              // ---------- الأقسام المخفية ----------
              public static Set<String> hidden(Context c, int sec) {
                  Set<String> out = new HashSet<>();
                  try {
                      JSONArray a = new JSONArray(sp(c).getString("hidden_" + sec, "[]"));
                      for (int i = 0; i < a.length(); i++) out.add(a.getString(i));
                  } catch (Exception ignored) {
                  }
                  return out;
              }

              public static void setHidden(Context c, int sec, String group, boolean hide) {
                  Set<String> h = hidden(c, sec);
                  if (hide) h.add(group);
                  else h.remove(group);
                  JSONArray a = new JSONArray();
                  for (String g : h) a.put(g);
                  sp(c).edit().putString("hidden_" + sec, a.toString()).apply();
              }

              public static void clearHidden(Context c) {
                  SharedPreferences.Editor e = sp(c).edit();
                  for (int i = 0; i < 3; i++) e.remove("hidden_" + i);
                  e.apply();
              }

              // ---------- آخر قناة ----------
              public static void setLastLive(Context c, Channel ch) {
                  List<Channel> l = new ArrayList<>();
                  l.add(ch);
                  putList(c, "last_live", l);
              }

              public static Channel lastLive(Context c) {
                  List<Channel> l = getList(c, "last_live");
                  return l.isEmpty() ? null : l.get(0);
              }

              // ---------- أكمل المشاهدة ----------
              public static long getPos(Context c, String url) {
                  if (url == null) return 0;
                  return positions(c).getLong(url, 0);
              }

              public static void setPos(Context c, String url, long pos) {
                  if (url == null) return;
                  if (pos <= 0) positions(c).edit().remove(url).apply();
                  else positions(c).edit().putLong(url, pos).apply();
              }

              public static List<Channel> cw(Context c, int sec) {
                  return getList(c, "cw_" + sec);
              }

              public static void touchCw(Context c, int sec, Channel ch) {
                  if (sec == Data.LIVE || ch.url == null) return;
                  List<Channel> l = cw(c, sec);
                  int i = indexOfKey(l, keyOf(ch));
                  if (i >= 0) l.remove(i);
                  l.add(0, ch);
                  while (l.size() > 40) l.remove(l.size() - 1);
                  putList(c, "cw_" + sec, l);
              }

              public static void removeCw(Context c, int sec, String url) {
                  if (url == null) return;
                  List<Channel> l = cw(c, sec);
                  int i = indexOfKey(l, url);
                  if (i >= 0) {
                      l.remove(i);
                      putList(c, "cw_" + sec, l);
                  }
              }

              public static void clearCw(Context c) {
                  sp(c).edit().remove("cw_1").remove("cw_2").apply();
                  positions(c).edit().clear().apply();
              }

              // ---------- الإعدادات ----------
              public static boolean opt(Context c, String key, boolean def) {
                  return sp(c).getBoolean("opt_" + key, def);
              }

              public static void setOpt(Context c, String key, boolean v) {
                  sp(c).edit().putBoolean("opt_" + key, v).apply();
              }
          }
          EOF

          cat > app/src/main/java/com/my/iptv/Ui.java <<'EOF'
          package com.my.iptv;

          import android.content.Context;
          import android.content.res.ColorStateList;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.InsetDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          // الألوان والأشكال الموحدة للتطبيق
          public class Ui {
              public static final int BG1 = 0xFF070B18;
              public static final int BG2 = 0xFF121A33;
              public static final int CARD = 0xFF1A2440;
              public static final int GLASS = 0x14FFFFFF;
              public static final int GLASS2 = 0x22FFFFFF;
              public static final int ACCENT1 = 0xFF7C5CFF;
              public static final int ACCENT2 = 0xFF22D3EE;
              public static final int TEXT = 0xFFFFFFFF;
              public static final int SUB = 0xFF94A3B8;
              public static final int LIVE = 0xFFEF4444;

              public static final Typeface MEDIUM = Typeface.create("sans-serif-medium", Typeface.NORMAL);
              public static final Typeface BOLD = Typeface.create("sans-serif", Typeface.BOLD);

              public static int dp(Context c, float v) {
                  return (int) (v * c.getResources().getDisplayMetrics().density);
              }

              public static GradientDrawable round(Context c, int color, float r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(c, r));
                  return g;
              }

              public static GradientDrawable stroke(Context c, int color, float r, int strokeColor, float w) {
                  GradientDrawable g = round(c, color, r);
                  g.setStroke(dp(c, w), strokeColor);
                  return g;
              }

              public static GradientDrawable accent(Context c, float r) {
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, new int[]{ACCENT1, ACCENT2});
                  g.setCornerRadius(dp(c, r));
                  return g;
              }

              public static Drawable background() {
                  return new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{BG1, BG2, 0xFF0A0F22});
              }

              public static Drawable selector(Context c) {
                  return new InsetDrawable(accent(c, 14), dp(c, 6), dp(c, 3), dp(c, 6), dp(c, 3));
              }

              public static StateListDrawable chipBg(Context c) {
                  StateListDrawable s = new StateListDrawable();
                  s.addState(new int[]{android.R.attr.state_focused}, accent(c, 22));
                  s.addState(new int[]{android.R.attr.state_pressed}, accent(c, 22));
                  s.addState(new int[]{android.R.attr.state_selected}, stroke(c, 0x337C5CFF, 22, ACCENT1, 2));
                  s.addState(new int[]{}, round(c, GLASS2, 22));
                  return s;
              }

              public static void focusScale(View v, float scale) {
                  v.setOnFocusChangeListener((x, has) -> x.animate()
                          .scaleX(has ? scale : 1f).scaleY(has ? scale : 1f).setDuration(140).start());
              }

              public static TextView chip(Context c, String text) {
                  TextView t = new TextView(c);
                  t.setText(text);
                  t.setTextColor(TEXT);
                  t.setTextSize(17);
                  t.setTypeface(MEDIUM);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(dp(c, 22), dp(c, 10), dp(c, 22), dp(c, 10));
                  t.setBackground(chipBg(c));
                  t.setFocusable(true);
                  t.setClickable(true);
                  focusScale(t, 1.08f);
                  return t;
              }

              public static StateListDrawable fieldBg(Context c) {
                  StateListDrawable s = new StateListDrawable();
                  s.addState(new int[]{android.R.attr.state_focused}, stroke(c, CARD, 24, ACCENT2, 2));
                  s.addState(new int[]{}, stroke(c, GLASS, 24, GLASS2, 1));
                  return s;
              }

              public static void field(Context c, EditText e) {
                  e.setBackground(fieldBg(c));
                  e.setTextColor(TEXT);
                  e.setHintTextColor(SUB);
                  e.setTextSize(18);
                  e.setSingleLine(true);
                  e.setPadding(dp(c, 20), dp(c, 12), dp(c, 20), dp(c, 12));
              }

              public static TextView text(Context c, String s, float size, int color, Typeface tf) {
                  TextView t = new TextView(c);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  if (tf != null) t.setTypeface(tf);
                  return t;
              }

              public static ProgressBar progress(Context c) {
                  ProgressBar p = new ProgressBar(c, null, android.R.attr.progressBarStyleHorizontal);
                  p.setMax(100);
                  p.setProgressTintList(ColorStateList.valueOf(ACCENT2));
                  p.setProgressBackgroundTintList(ColorStateList.valueOf(0x33FFFFFF));
                  return p;
              }
          }
          EOF

      - name: Custom app icon (upload icon.png or icon.jpg to the repo)
        working-directory: p
        run: |
          IMG=$(ls ../icon.png ../icon.jpg ../icon.jpeg ../icon.webp ../Icon.png ../Icon.jpg ../ICON.PNG ../ICON.JPG 2>/dev/null | head -1)
          if [ -n "$IMG" ]; then
            echo "Using $IMG as app icon"
            command -v convert >/dev/null || (sudo apt-get update && sudo apt-get install -y imagemagick)
            rm -f app/src/main/res/drawable/icon.xml app/src/main/res/drawable/banner.xml
            mkdir -p app/src/main/res/drawable-nodpi
            convert "$IMG[0]" -auto-orient -resize 512x512^ -gravity center -extent 512x512 app/src/main/res/drawable-nodpi/icon.png
            convert "$IMG[0]" -auto-orient -resize 640x360 -background "#101820" -gravity center -extent 640x360 app/src/main/res/drawable-nodpi/banner.png
          else
            echo "No icon.png in repo - using default icon"
          fi

      - name: Build APK
        working-directory: p
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore/iptv.jks" gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp p/app/build/outputs/apk/debug/app-debug.apk iptv.apk
          gh release create "v${{ github.run_number }}" iptv.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "IPTV v${{ github.run_number }}" \
            --notes "APK للتلفزيون"
