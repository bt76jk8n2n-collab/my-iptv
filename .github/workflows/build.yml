                      {"HR", "croatia"},
                      {"BR", "brazil", "البرازيل"},
                      {"AR", "argentina", "الأرجنتين"},
                      {"MX", "mexico"},
                      {"CA", "canada", "كندا"},
                      {"AU", "australia", "استراليا", "أستراليا"},
                      {"CN", "china", "الصين"},
                      {"JP", "japan", "اليابان"},
                      {"KR", "korea", "كوريا"},
                      {"TH", "thailand"},
                      {"ID", "indonesia", "اندونيسيا"},
                      {"MY", "malaysia", "ماليزيا"},
                      {"NG", "nigeria"},
                      {"ZA", "south africa"},
                      {"ET", "ethiopia"},
                      {"KE", "kenya"},
              };

              public static String find(String name) {
                  if (name == null) return null;
                  String low = name.toLowerCase();
                  Set<String> words = new HashSet<>(Arrays.asList(low.split("[^\\p{L}]+")));
                  for (String[] row : MAP) {
                      for (int k = 1; k < row.length; k++) {
                          String kw = row[k];
                          boolean arabic = kw.charAt(0) >= 0x0600 && kw.charAt(0) <= 0x06FF;
                          boolean hit;
                          if (arabic) hit = name.contains(kw);
                          else if (kw.contains(" ")) hit = low.contains(kw);
                          else hit = words.contains(kw);
                          if (hit) return emoji(row[0]);
                      }
                  }
                  return null;
              }

              static String emoji(String cc) {
                  int base = 0x1F1E6;
                  return new String(Character.toChars(base + cc.charAt(0) - 'A'))
                          + new String(Character.toChars(base + cc.charAt(1) - 'A'));
              }
          }
