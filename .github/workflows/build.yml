name: Build IPTV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # اسم التطبيق اللي يطلع على التلفزيون - تقدر تغيره
  APP_NAME: "alabdily10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write project files
        run: |
          mkdir -p p/app/src/main/java/com/my/iptv p/app/src/main/res/drawable
          cd p

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.my.iptv'
              compileSdk 34
              defaultConfig {
                  applicationId "com.my.iptv"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-ui:1.4.1'
          }
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MyIPTV"
          include ':app'
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="__APP_NAME__"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".LoginActivity" android:exported="false"
                      android:windowSoftInputMode="adjustResize" />
                  <activity android:name=".PlayerActivity" android:exported="false"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden" />
              </application>
          </manifest>
          EOF
          sed -i "s|__APP_NAME__|$APP_NAME|" app/src/main/AndroidManifest.xml

          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#1E3A8A" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#FFFFFF" android:pathData="M140,60L190,90L140,120z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#1E3A8A" android:pathData="M0,0h48v48h-48z" />
              <path android:fillColor="#FFFFFF" android:pathData="M18,14L36,24L18,34z" />
          </vector>
          EOF

          cat > app/src/main/java/com/my/iptv/Account.java <<'EOF'
          package com.my.iptv;

          import android.content.Context;
          import android.content.SharedPreferences;

          public class Account {
              public String type, m3u, server, user, pass;

              public static Account read(Context ctx) {
                  SharedPreferences p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE);
                  Account a = new Account();
                  a.type = p.getString("type", "m3u");
                  a.m3u = p.getString("m3u", "");
                  a.server = p.getString("server", "");
                  a.user = p.getString("user", "");
                  a.pass = p.getString("pass", "");
                  return a;
              }
          }
          EOF

          cat > app/src/main/java/com/my/iptv/Channel.java <<'EOF'
          package com.my.iptv;

          public class Channel {
              public String name;
              public String url;
              public String altUrl;
              public String group;
              public String seriesId;
              public long added;
          }
          EOF

          cat > app/src/main/java/com/my/iptv/Data.java <<'EOF'
          package com.my.iptv;

          import java.util.ArrayList;
          import java.util.List;

          public class Data {
              public static final int LIVE = 0;
              public static final int MOVIES = 1;
              public static final int SERIES = 2;

              public static final List<List<String>> groups = new ArrayList<>();
              public static final List<List<Channel>> items = new ArrayList<>();
              public static final boolean[] loaded = new boolean[3];
              public static final List<Channel> current = new ArrayList<>();

              static {
                  for (int i = 0; i < 3; i++) {
                      groups.add(new ArrayList<String>());
                      items.add(new ArrayList<Channel>());
                  }
              }

              public static void reset() {
                  for (int i = 0; i < 3; i++) {
                      loaded[i] = false;
                      groups.get(i).clear();
                      items.get(i).clear();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/my/iptv/Loader.java <<'EOF'
          package com.my.iptv;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.io.BufferedInputStream;
          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLDecoder;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          public class Loader {
              static final String[] UAS = {
                      "IPTVSmartersPlayer",
                      "Mozilla/5.0 (Linux; Android 11; Android TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
                      "okhttp/4.12.0",
                      "VLC/3.0.20 LibVLC/3.0.20"
              };
              public static volatile String UA = UAS[0];
              public static final String NO_GROUP = "بدون قسم";

              public static class Result {
                  public final List<String> groups = new ArrayList<>();
                  public final List<Channel> items = new ArrayList<>();
              }

              // ---------- أدوات الاتصال ----------

              static String fixUrl(String u) {
                  u = u.trim();
                  if (!u.startsWith("http://") && !u.startsWith("https://")) u = "http://" + u;
                  return u;
              }

              static String normServer(String s) {
                  s = fixUrl(s);
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              static String enc(String s) throws IOException {
                  return URLEncoder.encode(s, "UTF-8");
              }

              static long num(String s) {
                  try {
                      return Long.parseLong(s.trim());
                  } catch (Exception e) {
                      return 0;
                  }
              }

              static InputStream open(String u) throws IOException {
                  for (int i = 0; i < 6; i++) {
                      HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                      c.setRequestProperty("User-Agent", UA);
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(90000);
                      c.setInstanceFollowRedirects(false);
                      int code = c.getResponseCode();
                      if (code >= 300 && code < 400) {
                          String loc = c.getHeaderField("Location");
                          c.disconnect();
                          if (loc == null) throw new IOException("Redirect without location");
                          u = new URL(new URL(u), loc).toString();
                          continue;
                      }
                      if (code != 200) {
                          c.disconnect();
                          throw new IOException("HTTP " + code);
                      }
                      return new BufferedInputStream(c.getInputStream());
                  }
                  throw new IOException("Too many redirects");
              }

              static String readAll(String u) throws IOException {
                  InputStream in = open(u);
                  try {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return out.toString("UTF-8").replace("﻿", "").trim();
                  } finally {
                      in.close();
                  }
              }

              // بيانات Xtream: من خانات Xtream أو من رابط get.php
              public static String[] creds(Account a) {
                  if ("xtream".equals(a.type)) {
                      return new String[]{normServer(a.server), a.user.trim(), a.pass.trim()};
                  }
                  try {
                      URL u = new URL(fixUrl(a.m3u));
                      String q = u.getQuery();
                      if (q == null) return null;
                      String us = null, pw = null;
                      for (String kv : q.split("&")) {
                          int i = kv.indexOf('=');
                          if (i < 0) continue;
                          String k = kv.substring(0, i);
                          String v = URLDecoder.decode(kv.substring(i + 1), "UTF-8");
                          if (k.equals("username")) us = v;
                          else if (k.equals("password")) pw = v;
                      }
                      if (us == null || pw == null) return null;
                      String s = u.getProtocol() + "://" + u.getHost() + (u.getPort() > 0 ? ":" + u.getPort() : "");
                      return new String[]{s, us, pw};
                  } catch (Exception e) {
                      return null;
                  }
              }

              static String api(String[] c, String action) throws IOException {
                  return c[0] + "/player_api.php?username=" + enc(c[1]) + "&password=" + enc(c[2]) + "&action=" + action;
              }

              // يجيب قائمة JSON ويجرب أكثر من User-Agent
              static JSONArray getArray(String url) throws Exception {
                  List<String> order = new ArrayList<>();
                  order.add(UA);
                  for (String u : UAS) if (!u.equals(UA)) order.add(u);
                  String info = "";
                  for (String ua : order) {
                      UA = ua;
                      String body;
                      try {
                          body = readAll(url);
                      } catch (Exception e) {
                          info = String.valueOf(e.getMessage());
                          continue;
                      }
                      if (body.startsWith("[")) return new JSONArray(body);
                      if (body.contains("\"auth\":0")) throw new Exception("السيرفر رفض الحساب (auth:0)");
                      if (body.equals("{}") || body.isEmpty()) return new JSONArray();
                      info = body.length() > 150 ? body.substring(0, 150) : body;
                  }
                  throw new Exception("رد السيرفر: " + info);
              }

              static Map<String, String> readCats(JSONArray cats, List<String> order) throws JSONException {
                  Map<String, String> names = new HashMap<>();
                  for (int i = 0; i < cats.length(); i++) {
                      JSONObject o = cats.getJSONObject(i);
                      String n = o.optString("category_name", NO_GROUP);
                      names.put(o.optString("category_id"), n);
                      order.add(n);
                  }
                  return names;
              }

              static String groupOf(Map<String, String> names, JSONObject o) {
                  String g = names.get(o.optString("category_id"));
                  return g == null ? NO_GROUP : g;
              }

              static Result store(List<Channel> list, List<String> order) throws Exception {
                  if (list.isEmpty()) throw new Exception("ما لقيت ولا شي");
                  LinkedHashMap<String, List<Channel>> byGroup = new LinkedHashMap<>();
                  for (String g : order) byGroup.put(g, new ArrayList<Channel>());
                  for (Channel ch : list) {
                      List<Channel> l = byGroup.get(ch.group);
                      if (l == null) {
                          l = new ArrayList<>();
                          byGroup.put(ch.group, l);
                      }
                      l.add(ch);
                  }
                  Result r = new Result();
                  for (Map.Entry<String, List<Channel>> e : byGroup.entrySet()) {
                      if (e.getValue().isEmpty()) continue;
                      r.groups.add(e.getKey());
                      r.items.addAll(e.getValue());
                  }
                  return r;
              }

              // ---------- التحميل ----------

              public static Result loadSection(int sec, Account a) throws Exception {
                  if (sec == Data.LIVE) {
                      List<Channel> list = new ArrayList<>();
                      List<String> order = new ArrayList<>();
                      if ("xtream".equals(a.type)) loadLive(creds(a), list, order);
                      else loadM3u(a.m3u, list);
                      return store(list, order);
                  }
                  String[] c = creds(a);
                  if (c == null) throw new Exception("الأفلام والمسلسلات تحتاج دخول بـ Xtream");
                  return sec == Data.MOVIES ? loadMovies(c) : loadSeries(c);
              }

              static void loadM3u(String url, List<Channel> out) throws IOException {
                  BufferedReader r = new BufferedReader(new InputStreamReader(open(fixUrl(url)), "UTF-8"));
                  try {
                      String line;
                      String name = null;
                      String group = null;
                      while ((line = r.readLine()) != null) {
                          line = line.replace("﻿", "").trim();
                          if (line.isEmpty()) continue;
                          if (line.startsWith("#EXTINF")) {
                              int q = line.lastIndexOf('"');
                              int c = line.indexOf(',', q < 0 ? 0 : q);
                              name = c >= 0 ? line.substring(c + 1).trim() : null;
                              group = attr(line, "group-title");
                          } else if (line.startsWith("#EXTGRP:")) {
                              group = line.substring(8).trim();
                          } else if (!line.startsWith("#")) {
                              Channel ch = new Channel();
                              ch.url = line;
                              ch.name = (name != null && !name.isEmpty()) ? name : line;
                              ch.group = (group != null && !group.isEmpty()) ? group : NO_GROUP;
                              out.add(ch);
                              name = null;
                              group = null;
                          }
                      }
                  } finally {
                      r.close();
                  }
              }

              static String attr(String line, String key) {
                  String k = key + "=\"";
                  int i = line.indexOf(k);
                  if (i < 0) return null;
                  int s = i + k.length();
                  int e = line.indexOf('"', s);
                  return e < 0 ? null : line.substring(s, e).trim();
              }

              static void loadLive(String[] c, List<Channel> out, List<String> order) throws Exception {
                  JSONArray cats;
                  try {
                      cats = getArray(api(c, "get_live_categories"));
                  } catch (Exception first) {
                      if (String.valueOf(first.getMessage()).contains("auth:0")) throw first;
                      // آخر محاولة: القنوات كقائمة M3U من نفس السيرفر
                      String m3u = c[0] + "/get.php?username=" + enc(c[1]) + "&password=" + enc(c[2]) + "&type=m3u_plus&output=ts";
                      String info = String.valueOf(first.getMessage());
                      for (String ua : UAS) {
                          UA = ua;
                          try {
                              List<Channel> tmp = new ArrayList<>();
                              loadM3u(m3u, tmp);
                              if (!tmp.isEmpty()) {
                                  out.addAll(tmp);
                                  return;
                              }
                          } catch (Exception e) {
                              info = info + " | " + e.getMessage();
                          }
                      }
                      throw new Exception(info);
                  }
                  Map<String, String> names = readCats(cats, order);
                  JSONArray streams = getArray(api(c, "get_live_streams"));
                  for (int i = 0; i < streams.length(); i++) {
                      JSONObject o = streams.getJSONObject(i);
                      Channel ch = new Channel();
                      ch.name = o.optString("name", "");
                      ch.group = groupOf(names, o);
                      String path = c[0] + "/live/" + c[1] + "/" + c[2] + "/" + o.optString("stream_id");
                      ch.url = path + ".m3u8";
                      ch.altUrl = path + ".ts";
                      out.add(ch);
                  }
              }

              static Result loadMovies(String[] c) throws Exception {
                  List<String> order = new ArrayList<>();
                  Map<String, String> names = readCats(getArray(api(c, "get_vod_categories")), order);
                  JSONArray a = getArray(api(c, "get_vod_streams"));
                  List<Channel> list = new ArrayList<>();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.getJSONObject(i);
                      Channel ch = new Channel();
                      ch.name = o.optString("name", "");
                      ch.group = groupOf(names, o);
                      String ext = o.optString("container_extension", "mp4");
                      if (ext.isEmpty() || ext.equals("null")) ext = "mp4";
                      ch.url = c[0] + "/movie/" + c[1] + "/" + c[2] + "/" + o.optString("stream_id") + "." + ext;
                      ch.added = num(o.optString("added", "0"));
                      list.add(ch);
                  }
                  return store(list, order);
              }

              static Result loadSeries(String[] c) throws Exception {
                  List<String> order = new ArrayList<>();
                  Map<String, String> names = readCats(getArray(api(c, "get_series_categories")), order);
                  JSONArray a = getArray(api(c, "get_series"));
                  List<Channel> list = new ArrayList<>();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.getJSONObject(i);
                      Channel ch = new Channel();
                      ch.name = o.optString("name", "");
                      ch.group = groupOf(names, o);
                      ch.seriesId = o.optString("series_id");
                      ch.added = num(o.optString("last_modified", "0"));
                      list.add(ch);
                  }
                  return store(list, order);
              }

              public static List<Channel> loadEpisodes(Account acc, String seriesId) throws Exception {
                  String[] c = creds(acc);
                  if (c == null) throw new Exception("يحتاج دخول بـ Xtream");
                  String body = readAll(api(c, "get_series_info") + "&series_id=" + enc(seriesId));
                  JSONObject o = new JSONObject(body);
                  Object ep = o.opt("episodes");
                  List<JSONObject> eps = new ArrayList<>();
                  if (ep instanceof JSONObject) {
                      JSONObject m = (JSONObject) ep;
                      List<String> keys = new ArrayList<>();
                      Iterator<String> it = m.keys();
                      while (it.hasNext()) keys.add(it.next());
                      Collections.sort(keys, (x, y) -> Long.compare(num(x), num(y)));
                      for (String k : keys) {
                          JSONArray arr = m.optJSONArray(k);
                          if (arr == null) continue;
                          for (int i = 0; i < arr.length(); i++) eps.add(arr.getJSONObject(i));
                      }
                  } else if (ep instanceof JSONArray) {
                      JSONArray outer = (JSONArray) ep;
                      for (int i = 0; i < outer.length(); i++) {
                          Object x = outer.get(i);
                          if (x instanceof JSONArray) {
                              JSONArray arr = (JSONArray) x;
                              for (int j = 0; j < arr.length(); j++) eps.add(arr.getJSONObject(j));
                          } else if (x instanceof JSONObject) {
                              eps.add((JSONObject) x);
                          }
                      }
                  }
                  List<Channel> list = new ArrayList<>();
                  for (JSONObject e : eps) {
                      Channel ch = new Channel();
                      String season = e.optString("season", "");
                      String number = e.optString("episode_num", "");
                      String title = e.optString("title", "");
                      StringBuilder sb = new StringBuilder();
                      if (!season.isEmpty()) sb.append("الموسم ").append(season).append("  •  ");
                      sb.append("الحلقة ").append(number);
                      if (!title.isEmpty()) sb.append("  •  ").append(title);
                      ch.name = sb.toString();
                      String ext = e.optString("container_extension", "mp4");
                      if (ext.isEmpty() || ext.equals("null")) ext = "mp4";
                      ch.url = c[0] + "/series/" + c[1] + "/" + c[2] + "/" + e.optString("id") + "." + ext;
                      list.add(ch);
                  }
                  if (list.isEmpty()) throw new Exception("ما فيه حلقات لهالمسلسل");
                  return list;
              }
          }
          EOF

          cat > app/src/main/java/com/my/iptv/LoginActivity.java <<'EOF'
          package com.my.iptv;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.text.InputType;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class LoginActivity extends Activity {
              LinearLayout box;
              EditText m3u, server, user, pass;

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  SharedPreferences p = getSharedPreferences("cfg", MODE_PRIVATE);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(0xFF101820);
                  box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(48), dp(24), dp(48), dp(24));
                  sv.addView(box);

                  label("إعداد الاشتراك", 28, Color.WHITE);

                  label("الطريقة الأولى: رابط M3U", 20, 0xFF93C5FD);
                  m3u = field("الصق رابط M3U هنا", p.getString("m3u", ""),
                          InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  Button b1 = button("دخول بالرابط");
                  b1.setOnClickListener(v -> {
                      String u = m3u.getText().toString().trim();
                      if (u.isEmpty()) {
                          Toast.makeText(this, "اكتب الرابط أول", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      p.edit().putString("type", "m3u").putString("m3u", u).apply();
                      done();
                  });

                  label("الطريقة الثانية: Xtream Codes", 20, 0xFF93C5FD);
                  server = field("رابط السيرفر مثل http://example.com:8080", p.getString("server", ""),
                          InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  user = field("اسم المستخدم", p.getString("user", ""), InputType.TYPE_CLASS_TEXT);
                  pass = field("كلمة المرور", p.getString("pass", ""),
                          InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  Button b2 = button("دخول بـ Xtream");
                  b2.setOnClickListener(v -> {
                      String s = server.getText().toString().trim();
                      String us = user.getText().toString().trim();
                      String pw = pass.getText().toString().trim();
                      if (s.isEmpty() || us.isEmpty() || pw.isEmpty()) {
                          Toast.makeText(this, "عبّ كل الخانات", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      p.edit().putString("type", "xtream").putString("server", s)
                              .putString("user", us).putString("pass", pw).apply();
                      done();
                  });

                  setContentView(sv);
              }

              void done() {
                  Data.reset();
                  Intent i = new Intent(this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                  startActivity(i);
                  finish();
              }

              void label(String text, float size, int color) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(size);
                  tv.setTextColor(color);
                  tv.setPadding(0, dp(20), 0, dp(8));
                  box.addView(tv);
              }

              EditText field(String hint, String value, int inputType) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(value);
                  e.setSingleLine(true);
                  e.setInputType(inputType);
                  e.setTextColor(Color.WHITE);
                  e.setHintTextColor(0xFF8899AA);
                  e.setTextSize(20);
                  box.addView(e);
                  return e;
              }

              Button button(String text) {
