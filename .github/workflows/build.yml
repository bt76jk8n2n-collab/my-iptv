          cat > app/src/main/java/com/my/iptv/IconAdapter.java <<'EOF'
          package com.my.iptv;

          import android.content.Context;
          import android.graphics.Color;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import com.bumptech.glide.Glide;

          import java.util.List;

          public class IconAdapter extends BaseAdapter {
              public static class Row {
                  public final String text;
                  public final String icon;
                  public final String emoji;

                  public Row(String text, String icon, String emoji) {
                      this.text = text;
                      this.icon = icon;
                      this.emoji = emoji;
                  }
              }

              static class Holder {
                  ImageView image;
                  TextView emoji;
                  TextView text;
              }

              private final Context ctx;
              private final List<Row> rows;

              public IconAdapter(Context ctx, List<Row> rows) {
                  this.ctx = ctx;
                  this.rows = rows;
              }

              int dp(int v) {
                  return (int) (v * ctx.getResources().getDisplayMetrics().density);
              }

              @Override public int getCount() { return rows.size(); }
              @Override public Object getItem(int p) { return rows.get(p); }
              @Override public long getItemId(int p) { return p; }

              @Override
              public View getView(int p, View cv, ViewGroup parent) {
                  Holder h;
                  if (cv == null) {
                      LinearLayout row = new LinearLayout(ctx);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(dp(16), dp(8), dp(16), dp(8));
                      row.setMinimumHeight(dp(62));

                      FrameLayout box = new FrameLayout(ctx);
                      box.setBackground(Ui.round(ctx, 0x1AFFFFFF, 10));
                      box.setPadding(dp(4), dp(4), dp(4), dp(4));
                      h = new Holder();
                      h.image = new ImageView(ctx);
                      h.image.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      h.emoji = new TextView(ctx);
                      h.emoji.setTextSize(22);
                      h.emoji.setGravity(Gravity.CENTER);
                      box.addView(h.image, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT, Gravity.CENTER));
                      box.addView(h.emoji, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT, Gravity.CENTER));
                      row.addView(box, new LinearLayout.LayoutParams(dp(64), dp(44)));

                      h.text = new TextView(ctx);
                      h.text.setTextColor(Color.WHITE);
                      h.text.setTextSize(19);
                      h.text.setTypeface(Ui.MEDIUM);
                      h.text.setSingleLine(true);
                      h.text.setEllipsize(TextUtils.TruncateAt.END);
                      h.text.setPadding(dp(16), 0, dp(4), 0);
                      row.addView(h.text, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                      row.setTag(h);
                      cv = row;
                  } else {
                      h = (Holder) cv.getTag();
                  }
                  Row r = rows.get(p);
                  h.text.setText(r.text);
                  if (r.icon != null && !r.icon.isEmpty()) {
                      h.emoji.setVisibility(View.GONE);
                      h.image.setVisibility(View.VISIBLE);
                      Glide.with(ctx).load(r.icon).fitCenter().into(h.image);
                  } else {
                      Glide.with(ctx).clear(h.image);
                      h.image.setImageDrawable(null);
                      h.image.setVisibility(View.GONE);
                      h.emoji.setVisibility(View.VISIBLE);
                      h.emoji.setText(r.emoji == null ? "" : r.emoji);
                  }
                  return cv;
              }
          }
          EOF

          cat > app/src/main/java/com/my/iptv/Loader.java <<'EOF'
          package com.my.iptv;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.io.BufferedInputStream;
          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLDecoder;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          public class Loader {
              static final String[] UAS = {
                      "IPTVSmartersPlayer",
                      "Mozilla/5.0 (Linux; Android 11; Android TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
                      "okhttp/4.12.0",
                      "VLC/3.0.20 LibVLC/3.0.20"
              };
              public static volatile String UA = UAS[0];
              public static final String NO_GROUP = "بدون قسم";

              public static class Result {
                  public final List<String> groups = new ArrayList<>();
                  public final List<Channel> items = new ArrayList<>();
              }

              // ---------- أدوات الاتصال ----------

              static String fixUrl(String u) {
                  u = u.trim();
                  if (!u.startsWith("http://") && !u.startsWith("https://")) u = "http://" + u;
                  return u;
              }

              static String normServer(String s) {
                  s = fixUrl(s);
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              static String enc(String s) throws IOException {
                  return URLEncoder.encode(s, "UTF-8");
              }

              static long num(String s) {
                  try {
                      return Long.parseLong(s.trim());
                  } catch (Exception e) {
                      return 0;
                  }
              }

              static String str(JSONObject o, String key) {
                  String v = o.optString(key, "");
                  return v.equals("null") ? "" : v.trim();
              }

              static InputStream open(String u) throws IOException {
                  for (int i = 0; i < 6; i++) {
                      HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                      c.setRequestProperty("User-Agent", UA);
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(90000);
                      c.setInstanceFollowRedirects(false);
                      int code = c.getResponseCode();
                      if (code >= 300 && code < 400) {
                          String loc = c.getHeaderField("Location");
                          c.disconnect();
                          if (loc == null) throw new IOException("Redirect without location");
                          u = new URL(new URL(u), loc).toString();
                          continue;
                      }
                      if (code != 200) {
                          c.disconnect();
                          throw new IOException("HTTP " + code);
                      }
                      return new BufferedInputStream(c.getInputStream());
                  }
                  throw new IOException("Too many redirects");
              }

              static String readAll(String u) throws IOException {
                  InputStream in = open(u);
                  try {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return out.toString("UTF-8").replace("﻿", "").trim();
                  } finally {
                      in.close();
                  }
              }

              // بيانات Xtream: من خانات Xtream أو من رابط get.php
              public static String[] creds(Account a) {
                  if ("xtream".equals(a.type)) {
                      return new String[]{normServer(a.server), a.user.trim(), a.pass.trim()};
                  }
                  try {
                      URL u = new URL(fixUrl(a.m3u));
                      String q = u.getQuery();
                      if (q == null) return null;
                      String us = null, pw = null;
                      for (String kv : q.split("&")) {
                          int i = kv.indexOf('=');
                          if (i < 0) continue;
                          String k = kv.substring(0, i);
                          String v = URLDecoder.decode(kv.substring(i + 1), "UTF-8");
                          if (k.equals("username")) us = v;
                          else if (k.equals("password")) pw = v;
                      }
                      if (us == null || pw == null) return null;
                      String s = u.getProtocol() + "://" + u.getHost() + (u.getPort() > 0 ? ":" + u.getPort() : "");
                      return new String[]{s, us, pw};
                  } catch (Exception e) {
                      return null;
                  }
              }

              static String api(String[] c, String action) throws IOException {
                  return c[0] + "/player_api.php?username=" + enc(c[1]) + "&password=" + enc(c[2]) + "&action=" + action;
              }

              // يجيب قائمة JSON ويجرب أكثر من User-Agent
              static JSONArray getArray(String url) throws Exception {
                  List<String> order = new ArrayList<>();
                  order.add(UA);
                  for (String u : UAS) if (!u.equals(UA)) order.add(u);
                  String info = "";
                  for (String ua : order) {
                      UA = ua;
                      String body;
                      try {
                          body = readAll(url);
                      } catch (Exception e) {
                          info = String.valueOf(e.getMessage());
                          continue;
                      }
                      if (body.startsWith("[")) return new JSONArray(body);
                      if (body.contains("\"auth\":0")) throw new Exception("السيرفر رفض الحساب (auth:0)");
                      if (body.equals("{}") || body.isEmpty()) return new JSONArray();
                      info = body.length() > 150 ? body.substring(0, 150) : body;
                  }
                  throw new Exception("رد السيرفر: " + info);
              }

              static Map<String, String> readCats(JSONArray cats, List<String> order) throws JSONException {
                  Map<String, String> names = new HashMap<>();
                  for (int i = 0; i < cats.length(); i++) {
                      JSONObject o = cats.getJSONObject(i);
                      String n = o.optString("category_name", NO_GROUP);
                      names.put(o.optString("category_id"), n);
                      order.add(n);
                  }
                  return names;
              }

              static String groupOf(Map<String, String> names, JSONObject o) {
                  String g = names.get(o.optString("category_id"));
                  return g == null ? NO_GROUP : g;
              }

              static Result store(List<Channel> list, List<String> order) throws Exception {
                  if (list.isEmpty()) throw new Exception("ما لقيت ولا شي");
                  LinkedHashMap<String, List<Channel>> byGroup = new LinkedHashMap<>();
                  for (String g : order) byGroup.put(g, new ArrayList<Channel>());
                  for (Channel ch : list) {
                      List<Channel> l = byGroup.get(ch.group);
                      if (l == null) {
                          l = new ArrayList<>();
                          byGroup.put(ch.group, l);
                      }
                      l.add(ch);
                  }
                  Result r = new Result();
                  for (Map.Entry<String, List<Channel>> e : byGroup.entrySet()) {
                      if (e.getValue().isEmpty()) continue;
                      r.groups.add(e.getKey());
                      r.items.addAll(e.getValue());
                  }
                  return r;
              }

              // ---------- التحميل ----------

              public static Result loadSection(int sec, Account a) throws Exception {
                  if (sec == Data.LIVE) {
                      List<Channel> list = new ArrayList<>();
                      List<String> order = new ArrayList<>();
                      if ("xtream".equals(a.type)) loadLive(creds(a), list, order);
                      else loadM3u(a.m3u, list);
                      return store(list, order);
                  }
                  String[] c = creds(a);
                  if (c == null) throw new Exception("الأفلام والمسلسلات تحتاج دخول بـ Xtream");
                  return sec == Data.MOVIES ? loadMovies(c) : loadSeries(c);
              }

              static void loadM3u(String url, List<Channel> out) throws IOException {
                  BufferedReader r = new BufferedReader(new InputStreamReader(open(fixUrl(url)), "UTF-8"));
                  try {
                      String line;
                      String name = null;
                      String group = null;
                      String logo = null;
                      while ((line = r.readLine()) != null) {
                          line = line.replace("﻿", "").trim();
                          if (line.isEmpty()) continue;
                          if (line.startsWith("#EXTINF")) {
                              int q = line.lastIndexOf('"');
                              int c = line.indexOf(',', q < 0 ? 0 : q);
                              name = c >= 0 ? line.substring(c + 1).trim() : null;
                              group = attr(line, "group-title");
                              logo = attr(line, "tvg-logo");
                          } else if (line.startsWith("#EXTGRP:")) {
                              group = line.substring(8).trim();
                          } else if (!line.startsWith("#")) {
                              Channel ch = new Channel();
                              ch.url = line;
                              ch.name = (name != null && !name.isEmpty()) ? name : line;
                              ch.group = (group != null && !group.isEmpty()) ? group : NO_GROUP;
                              ch.logo = logo;
                              out.add(ch);
                              name = null;
                              group = null;
                              logo = null;
                          }
                      }
                  } finally {
                      r.close();
                  }
              }

              static String attr(String line, String key) {
                  String k = key + "=\"";
                  int i = line.indexOf(k);
                  if (i < 0) return null;
                  int s = i + k.length();
                  int e = line.indexOf('"', s);
                  return e < 0 ? null : line.substring(s, e).trim();
              }

              static void loadLive(String[] c, List<Channel> out, List<String> order) throws Exception {
                  JSONArray cats;
                  try {
                      cats = getArray(api(c, "get_live_categories"));
                  } catch (Exception first) {
                      if (String.valueOf(first.getMessage()).contains("auth:0")) throw first;
                      // آخر محاولة: القنوات كقائمة M3U من نفس السيرفر
                      String m3u = c[0] + "/get.php?username=" + enc(c[1]) + "&password=" + enc(c[2]) + "&type=m3u_plus&output=ts";
                      String info = String.valueOf(first.getMessage());
                      for (String ua : UAS) {
                          UA = ua;
                          try {
                              List<Channel> tmp = new ArrayList<>();
                              loadM3u(m3u, tmp);
                              if (!tmp.isEmpty()) {
                                  out.addAll(tmp);
                                  return;
                              }
                          } catch (Exception e) {
                              info = info + " | " + e.getMessage();
                          }
                      }
                      throw new Exception(info);
                  }
                  Map<String, String> names = readCats(cats, order);
                  JSONArray streams = getArray(api(c, "get_live_streams"));
                  for (int i = 0; i < streams.length(); i++) {
                      JSONObject o = streams.getJSONObject(i);
                      Channel ch = new Channel();
                      ch.name = o.optString("name", "");
                      ch.group = groupOf(names, o);
                      ch.logo = str(o, "stream_icon");
                      ch.streamId = o.optString("stream_id");
                      String path = c[0] + "/live/" + c[1] + "/" + c[2] + "/" + o.optString("stream_id");
                      ch.url = path + ".m3u8";
                      ch.altUrl = path + ".ts";
                      out.add(ch);
                  }
              }

              static Result loadMovies(String[] c) throws Exception {
                  List<String> order = new ArrayList<>();
                  Map<String, String> names = readCats(getArray(api(c, "get_vod_categories")), order);
                  JSONArray a = getArray(api(c, "get_vod_streams"));
                  List<Channel> list = new ArrayList<>();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.getJSONObject(i);
                      Channel ch = new Channel();
                      ch.name = o.optString("name", "");
                      ch.group = groupOf(names, o);
                      String ext = o.optString("container_extension", "mp4");
                      if (ext.isEmpty() || ext.equals("null")) ext = "mp4";
                      ch.url = c[0] + "/movie/" + c[1] + "/" + c[2] + "/" + o.optString("stream_id") + "." + ext;
                      ch.added = num(o.optString("added", "0"));
                      ch.logo = str(o, "stream_icon");
                      list.add(ch);
                  }
                  return store(list, order);
              }

              static Result loadSeries(String[] c) throws Exception {
                  List<String> order = new ArrayList<>();
                  Map<String, String> names = readCats(getArray(api(c, "get_series_categories")), order);
                  JSONArray a = getArray(api(c, "get_series"));
                  List<Channel> list = new ArrayList<>();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.getJSONObject(i);
                      Channel ch = new Channel();
                      ch.name = o.optString("name", "");
                      ch.group = groupOf(names, o);
                      ch.seriesId = o.optString("series_id");
                      ch.added = num(o.optString("last_modified", "0"));
                      ch.logo = str(o, "cover");
                      list.add(ch);
                  }
                  return store(list, order);
              }

              public static List<Channel> loadEpisodes(Account acc, String seriesId) throws Exception {
                  String[] c = creds(acc);
                  if (c == null) throw new Exception("يحتاج دخول بـ Xtream");
                  String body = readAll(api(c, "get_series_info") + "&series_id=" + enc(seriesId));
                  JSONObject o = new JSONObject(body);
                  Object ep = o.opt("episodes");
                  List<JSONObject> eps = new ArrayList<>();
                  if (ep instanceof JSONObject) {
                      JSONObject m = (JSONObject) ep;
                      List<String> keys = new ArrayList<>();
                      Iterator<String> it = m.keys();
                      while (it.hasNext()) keys.add(it.next());
                      Collections.sort(keys, (x, y) -> Long.compare(num(x), num(y)));
                      for (String k : keys) {
                          JSONArray arr = m.optJSONArray(k);
                          if (arr == null) continue;
                          for (int i = 0; i < arr.length(); i++) eps.add(arr.getJSONObject(i));
                      }
                  } else if (ep instanceof JSONArray) {
                      JSONArray outer = (JSONArray) ep;
                      for (int i = 0; i < outer.length(); i++) {
                          Object x = outer.get(i);
                          if (x instanceof JSONArray) {
                              JSONArray arr = (JSONArray) x;
                              for (int j = 0; j < arr.length(); j++) eps.add(arr.getJSONObject(j));
                          } else if (x instanceof JSONObject) {
                              eps.add((JSONObject) x);
                          }
                      }
                  }
                  List<Channel> list = new ArrayList<>();
                  for (JSONObject e : eps) {
                      Channel ch = new Channel();
                      String season = e.optString("season", "");
                      String number = e.optString("episode_num", "");
                      String title = e.optString("title", "");
                      StringBuilder sb = new StringBuilder();
                      if (!season.isEmpty()) sb.append("الموسم ").append(season).append("  •  ");
                      sb.append("الحلقة ").append(number);
                      if (!title.isEmpty()) sb.append("  •  ").append(title);
                      ch.name = sb.toString();
                      String ext = e.optString("container_extension", "mp4");
                      if (ext.isEmpty() || ext.equals("null")) ext = "mp4";
                      ch.url = c[0] + "/series/" + c[1] + "/" + c[2] + "/" + e.optString("id") + "." + ext;
                      ch.seriesId = seriesId;
                      list.add(ch);
                  }
                  if (list.isEmpty()) throw new Exception("ما فيه حلقات لهالمسلسل");
                  return list;
              }
          }
