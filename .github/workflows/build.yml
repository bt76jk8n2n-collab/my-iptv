name: Build IPTV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # اسم التطبيق اللي يطلع على التلفزيون - تقدر تغيره
  APP_NAME: "IPTV"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key (created once, then reused so updates install over the old app)
        run: |
          if [ ! -f keystore/iptv.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/iptv.jks -alias iptv -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass iptv123456 -keypass iptv123456 -dname "CN=IPTV"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/iptv.jks
            git commit -m "Add signing key [skip ci]"
            git push
          fi

      - name: Write project files
        run: |
          mkdir -p p/app/src/main/java/com/my/iptv p/app/src/main/res/drawable
          cd p

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.my.iptv'
              compileSdk 34
              defaultConfig {
                  applicationId "com.my.iptv"
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
                  versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
              }
              signingConfigs {
                  fixed {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "none.jks")
                      storePassword "iptv123456"
                      keyAlias "iptv"
                      keyPassword "iptv123456"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-ui:1.4.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MyIPTV"
          include ':app'
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="__APP_NAME__"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".LoginActivity" android:exported="false"
                      android:windowSoftInputMode="adjustResize" />
                  <activity android:name=".PlayerActivity" android:exported="false"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden" />
              </application>
          </manifest>
          EOF
          sed -i "s|__APP_NAME__|$APP_NAME|" app/src/main/AndroidManifest.xml

          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#1E3A8A" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#FFFFFF" android:pathData="M140,60L190,90L140,120z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#1E3A8A" android:pathData="M0,0h48v48h-48z" />
              <path android:fillColor="#FFFFFF" android:pathData="M18,14L36,24L18,34z" />
          </vector>
          EOF

          cat > app/src/main/java/com/my/iptv/Account.java <<'EOF'
          package com.my.iptv;

          import android.content.Context;
          import android.content.SharedPreferences;

          public class Account {
              public String type, m3u, server, user, pass;

              public static Account read(Context ctx) {
                  SharedPreferences p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE);
                  Account a = new Account();
                  a.type = p.getString("type", "m3u");
                  a.m3u = p.getString("m3u", "");
                  a.server = p.getString("server", "");
                  a.user = p.getString("user", "");
                  a.pass = p.getString("pass", "");
                  return a;
              }
          }
          EOF

          cat > app/src/main/java/com/my/iptv/Channel.java <<'EOF'
          package com.my.iptv;

          public class Channel {
              public String name;
              public String url;
              public String altUrl;
              public String group;
              public String seriesId;
              public String logo;
              public long added;
          }
          EOF

          cat > app/src/main/java/com/my/iptv/Data.java <<'EOF'
          package com.my.iptv;

          import java.util.ArrayList;
          import java.util.List;

          public class Data {
              public static final int LIVE = 0;
              public static final int MOVIES = 1;
              public static final int SERIES = 2;

              public static final List<List<String>> groups = new ArrayList<>();
              public static final List<List<Channel>> items = new ArrayList<>();
              public static final boolean[] loaded = new boolean[3];
              public static final List<Channel> current = new ArrayList<>();

              static {
                  for (int i = 0; i < 3; i++) {
                      groups.add(new ArrayList<String>());
                      items.add(new ArrayList<Channel>());
                  }
              }

              public static void reset() {
                  for (int i = 0; i < 3; i++) {
                      loaded[i] = false;
                      groups.get(i).clear();
                      items.get(i).clear();
                  }
              }
          }
          EOF

