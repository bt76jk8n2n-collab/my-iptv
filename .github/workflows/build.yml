              void showTracks() {
                  List<String> labels = new ArrayList<>();
                  List<Runnable> actions = new ArrayList<>();
                  for (Tracks.Group g : player.getCurrentTracks().getGroups()) {
                      final int type = g.getType();
                      if (type != C.TRACK_TYPE_AUDIO && type != C.TRACK_TYPE_TEXT) continue;
                      final TrackGroup tg = g.getMediaTrackGroup();
                      for (int i = 0; i < g.length; i++) {
                          if (!g.isTrackSupported(i)) continue;
                          final int idx = i;
                          String prefix = type == C.TRACK_TYPE_AUDIO ? "🔊  الصوت: " : "💬  الترجمة: ";
                          labels.add(prefix + trackName(g.getTrackFormat(i)) + (g.isTrackSelected(i) ? "  ✓" : ""));
                          actions.add(() -> player.setTrackSelectionParameters(player.getTrackSelectionParameters().buildUpon()
                                  .setTrackTypeDisabled(type, false)
                                  .setOverrideForType(new TrackSelectionOverride(tg, idx))
                                  .build()));
                      }
