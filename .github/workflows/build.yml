              void hideKeyboard() {
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null) imm.hideSoftInputFromWindow(search.getWindowToken(), 0);
              }

              String query() {
                  return search.getText().toString().trim();
              }

              // توحيد الحروف العربية عشان البحث يلقى الاسم مهما انكتب
              static String norm(String s) {
                  s = s.toLowerCase();
                  StringBuilder sb = new StringBuilder(s.length());
                  for (int i = 0; i < s.length(); i++) {
                      char ch = s.charAt(i);
                      switch (ch) {
                          case 'أ': case 'إ': case 'آ': ch = 'ا'; break;
                          case 'ة': ch = 'ه'; break;
                          case 'ى': ch = 'ي'; break;
                          case 'ؤ': ch = 'و'; break;
                          case 'ئ': ch = 'ي'; break;
                          case '_': case '-': case '.': ch = ' '; break;
                      }
                      if (ch >= 'ً' && ch <= 'ْ') continue; // التشكيل
                      sb.append(ch);
                  }
                  return sb.toString();
              }

              void switchSection(int sec) {
                  section = sec;
                  inEpisodes = false;
                  for (int i = 0; i < 3; i++) {
                      tabs[i].setAlpha(i == sec ? 1f : 0.55f);
                      tabs[i].setText(i == sec ? "● " + TAB_NAMES[i] : TAB_NAMES[i]);
                  }
                  if (!query().isEmpty()) search.setText("");
                  groupNames.clear();
                  groupAdapter.notifyDataSetChanged();
                  shown.clear();
                  rowNames.clear();
                  channelAdapter.notifyDataSetChanged();
                  if (Data.loaded[sec]) showData();
                  else load(sec);
              }

              void load(final int sec) {
                  if (loading[sec]) return;
                  loading[sec] = true;
                  if (sec == section) status.setText("جاري تحميل " + TAB_NAMES[sec] + "...");
                  final Account acc = Account.read(this);
                  new Thread(() -> {
                      try {
                          final Loader.Result r = Loader.loadSection(sec, acc);
                          ui.post(() -> {
                              loading[sec] = false;
                              Data.groups.get(sec).clear();
                              Data.groups.get(sec).addAll(r.groups);
                              Data.items.get(sec).clear();
                              Data.items.get(sec).addAll(r.items);
                              Data.loaded[sec] = true;
                              if (sec == section) showData();
                          });
                      } catch (Exception e) {
                          final String msg = e.getMessage();
                          ui.post(() -> {
                              loading[sec] = false;
                              if (sec == section) status.setText("تعذر التحميل: " + msg + " — اضغط تحديث أو غيّر الحساب");
                          });
                      }
                  }).start();
              }

              int firstRealGroup() {
                  return section == Data.LIVE ? 1 : 2;
              }

              void showData() {
                  List<Channel> all = Data.items.get(section);
                  groupNames.clear();
                  groupNames.add("الكل (" + all.size() + ")");
                  if (section != Data.LIVE) groupNames.add("🆕 الأحدث");
                  groupNames.addAll(Data.groups.get(section));
                  groupAdapter.notifyDataSetChanged();
                  int start = section == Data.LIVE ? 0 : 1;
                  selectedGroup = -1;
                  showGroup(start, true);
                  groupList.setSelection(start);
                  groupList.requestFocus();
              }

              void showGroup(int pos, boolean force) {
                  if (pos < 0 || pos >= groupNames.size()) return;
                  if (!force && pos == selectedGroup && !inEpisodes) return;
                  selectedGroup = pos;
                  groupAdapter.highlight = pos;
                  groupAdapter.notifyDataSetChanged();
                  rebuild();
              }

              void rebuild() {
                  inEpisodes = false;
                  List<Channel> src = Data.items.get(section);
                  shown.clear();
                  String q = norm(query());
                  if (!q.isEmpty()) {
                      String[] words = q.split("\\s+");
                      for (Channel ch : src) {
                          String n = norm(ch.name);
                          boolean ok = true;
                          for (String w : words) {
                              if (!n.contains(w)) {
                                  ok = false;
                                  break;
                              }
                          }
                          if (ok) shown.add(ch);
                      }
                  } else if (selectedGroup <= 0) {
                      shown.addAll(src);
                  } else if (section != Data.LIVE && selectedGroup == 1) {
                      List<Channel> tmp = new ArrayList<>(src);
                      Collections.sort(tmp, (a, b) -> Long.compare(b.added, a.added));
                      shown.addAll(tmp.subList(0, Math.min(NEWEST_COUNT, tmp.size())));
                  } else {
                      String g = groupNames.get(selectedGroup);
                      for (Channel ch : src) if (g.equals(ch.group)) shown.add(ch);
                  }
                  fillRows();
                  if (!q.isEmpty()) {
                      status.setText("نتائج البحث: " + shown.size());
                  } else if (Data.loaded[section]) {
                      status.setText(TAB_NAMES[section] + "  •  " + Data.groups.get(section).size() + " قسم  •  "
                              + src.size() + (section == Data.LIVE ? " قناة  •  اكتب رقم القناة بالريموت للانتقال لها" : ""));
                  }
              }

              void fillRows() {
                  rowNames.clear();
                  for (int i = 0; i < shown.size(); i++) {
                      String n = shown.get(i).name;
                      rowNames.add(section == Data.LIVE && !inEpisodes ? (i + 1) + ".  " + n : n);
                  }
                  channelAdapter.notifyDataSetChanged();
                  channelList.setSelection(0);
              }

              void openItem(int pos) {
                  if (pos < 0 || pos >= shown.size()) return;
                  if (section == Data.SERIES && !inEpisodes) {
                      openSeries(shown.get(pos));
                  } else {
                      play(pos, section != Data.LIVE);
                  }
              }

              void play(int pos, boolean vod) {
                  Data.current.clear();
                  Data.current.addAll(shown);
                  Intent i = new Intent(this, PlayerActivity.class);
                  i.putExtra("index", pos);
                  i.putExtra("vod", vod);
                  startActivity(i);
              }

              void openSeries(final Channel series) {
                  status.setText("جاري تحميل حلقات: " + series.name + "...");
                  final Account acc = Account.read(this);
                  new Thread(() -> {
                      try {
                          final List<Channel> eps = Loader.loadEpisodes(acc, series.seriesId);
                          ui.post(() -> {
                              if (section != Data.SERIES) return;
                              inEpisodes = true;
                              shown.clear();
                              shown.addAll(eps);
                              fillRows();
                              status.setText(series.name + "  •  " + eps.size() + " حلقة  •  زر الرجوع يرجعك للمسلسلات");
                              channelList.requestFocus();
                          });
                      } catch (Exception e) {
                          final String msg = e.getMessage();
                          ui.post(() -> status.setText("تعذر تحميل الحلقات: " + msg));
                      }
                  }).start();
              }

              // كتابة رقم القناة بالريموت مثل الرسيفر
              void jumpToNumber() {
                  int n = (int) Loader.num(digits);
                  digits = "";
                  if (section != Data.LIVE || inEpisodes) return;
                  if (n >= 1 && n <= shown.size()) {
                      channelList.setSelection(n - 1);
                      play(n - 1, false);
                  } else {
                      status.setText("ما فيه قناة بهالرقم");
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent e) {
                  boolean typing = getCurrentFocus() instanceof EditText;
                  if (!typing && section == Data.LIVE && !inEpisodes
                          && keyCode >= KeyEvent.KEYCODE_0 && keyCode <= KeyEvent.KEYCODE_9) {
                      if (digits.length() < 5) digits += (char) ('0' + keyCode - KeyEvent.KEYCODE_0);
                      status.setText("رقم القناة: " + digits);
                      ui.removeCallbacks(jumpRun);
                      ui.postDelayed(jumpRun, 1500);
                      return true;
                  }
                  if (!typing && keyCode == KeyEvent.KEYCODE_SEARCH) {
                      search.requestFocus();
                      return true;
                  }
                  return super.onKeyDown(keyCode, e);
              }

              @Override
              public void onBackPressed() {
                  if (inEpisodes) {
                      rebuild();
                      channelList.requestFocus();
                      return;
                  }
                  if (!query().isEmpty()) {
                      search.setText("");
                      rebuild();
                      return;
                  }
                  super.onBackPressed();
              }
          }
