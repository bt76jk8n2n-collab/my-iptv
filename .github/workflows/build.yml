          package com.my.iptv;

          import android.content.Context;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.datasource.DefaultDataSource;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;

          import java.util.ArrayList;
          import java.util.List;

          public class Players {
              public static ExoPlayer create(Context ctx) {
                  DefaultHttpDataSource.Factory http = new DefaultHttpDataSource.Factory()
                          .setUserAgent(Loader.UA)
                          .setAllowCrossProtocolRedirects(true)
                          .setConnectTimeoutMs(20000)
                          .setReadTimeoutMs(30000);
                  ExoPlayer p = new ExoPlayer.Builder(ctx)
                          .setMediaSourceFactory(new DefaultMediaSourceFactory(ctx)
                                  .setDataSourceFactory(new DefaultDataSource.Factory(ctx, http)))
                          .setSeekBackIncrementMs(10000)
                          .setSeekForwardIncrementMs(30000)
                          .build();
                  p.setTrackSelectionParameters(p.getTrackSelectionParameters().buildUpon()
                          .setPreferredTextLanguage("ar")
                          .build());
                  return p;
              }

              // الروابط اللي نجربها بالترتيب لين وحدة تشتغل
              public static List<MediaItem> tries(Channel c, boolean vod) {
                  List<MediaItem> t = new ArrayList<>();
                  t.add(MediaItem.fromUri(c.url));
                  if (c.altUrl != null) t.add(MediaItem.fromUri(c.altUrl));
                  if (!vod && !c.url.contains(".m3u8")) {
                      t.add(new MediaItem.Builder().setUri(c.url).setMimeType(MimeTypes.APPLICATION_M3U8).build());
                  }
                  return t;
              }
          }
