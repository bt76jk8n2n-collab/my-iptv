                      switch (ch) {
                          case 'أ': case 'إ': case 'آ': ch = 'ا'; break;
                          case 'ة': ch = 'ه'; break;
                          case 'ى': ch = 'ي'; break;
                          case 'ؤ': ch = 'و'; break;
                          case 'ئ': ch = 'ي'; break;
                          case '_': case '-': case '.': ch = ' '; break;
