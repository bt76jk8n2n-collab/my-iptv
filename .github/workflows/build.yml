          cat > app/src/main/java/com/my/iptv/PlayerActivity.java <<'EOF'
          package com.my.iptv;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.datasource.DefaultDataSource;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;

          import java.util.ArrayList;
          import java.util.List;

          public class PlayerActivity extends Activity {
              ExoPlayer player;
              PlayerView view;
              TextView info;
              int index;
              boolean vod;
              String digits = "";
              int lastHandled = -1;
              final List<MediaItem> tries = new ArrayList<>();
              int tryIndex;
              final Handler h = new Handler(Looper.getMainLooper());
              final Runnable hideInfo = () -> info.setVisibility(View.GONE);
              final Runnable jumpRun = this::jumpToNumber;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Data.current.isEmpty()) {
                      finish();
                      return;
                  }
                  index = getIntent().getIntExtra("index", 0);
                  vod = getIntent().getBooleanExtra("vod", false);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  view = new PlayerView(this);
                  view.setUseController(vod);
                  view.setControllerShowTimeoutMs(4000);
                  root.addView(view, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  info = new TextView(this);
                  info.setTextColor(Color.WHITE);
                  info.setTextSize(26);
                  info.setBackgroundColor(0xCC000000);
                  info.setPadding(40, 24, 40, 24);
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.START);
                  lp.setMargins(48, 48, 48, 48);
                  root.addView(info, lp);
                  setContentView(root);

                  DefaultHttpDataSource.Factory http = new DefaultHttpDataSource.Factory()
                          .setUserAgent(Loader.UA)
                          .setAllowCrossProtocolRedirects(true)
                          .setConnectTimeoutMs(20000)
                          .setReadTimeoutMs(30000);
                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(new DefaultMediaSourceFactory(this)
                                  .setDataSourceFactory(new DefaultDataSource.Factory(this, http)))
                          .setSeekBackIncrementMs(10000)
                          .setSeekForwardIncrementMs(30000)
                          .build();
                  view.setPlayer(player);
                  player.addListener(new Player.Listener() {
                      @Override
                      public void onPlayerError(PlaybackException e) {
                          if (e.errorCode == PlaybackException.ERROR_CODE_BEHIND_LIVE_WINDOW) {
                              player.seekToDefaultPosition();
                              player.prepare();
                              return;
                          }
                          tryIndex++;
                          if (tryIndex < tries.size()) {
                              startTry();
                          } else {
                              showInfo("تعذر التشغيل: " + current().name, 6000);
                          }
                      }
                  });
                  play(index);
              }

              Channel current() {
                  return Data.current.get(index);
              }

              void play(int i) {
                  int n = Data.current.size();
                  index = ((i % n) + n) % n;
                  Channel c = current();
                  tries.clear();
                  tries.add(MediaItem.fromUri(c.url));
                  if (c.altUrl != null) tries.add(MediaItem.fromUri(c.altUrl));
                  if (!vod && !c.url.contains(".m3u8")) {
                      tries.add(new MediaItem.Builder().setUri(c.url).setMimeType(MimeTypes.APPLICATION_M3U8).build());
                  }
                  tryIndex = 0;
                  startTry();
                  showInfo(vod ? c.name : (index + 1) + ".  " + c.name, 3000);
              }

              void startTry() {
                  player.setMediaItem(tries.get(tryIndex));
                  player.prepare();
                  player.play();
              }

              void showInfo(String text, long ms) {
                  info.setText(text);
                  info.setVisibility(View.VISIBLE);
                  h.removeCallbacks(hideInfo);
                  h.postDelayed(hideInfo, ms);
              }

              void jumpToNumber() {
                  int n = (int) Loader.num(digits);
                  digits = "";
                  if (n >= 1 && n <= Data.current.size()) play(n - 1);
                  else showInfo("ما فيه قناة بهالرقم", 2000);
              }

              boolean handleVodKey(int code) {
                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_LEFT:
                      case KeyEvent.KEYCODE_MEDIA_REWIND:
                          player.seekBack();
                          view.showController();
                          return true;
                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD:
                          player.seekForward();
                          view.showController();
                          return true;
                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                      case KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                          player.setPlayWhenReady(!player.getPlayWhenReady());
                          view.showController();
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PLAY:
                          player.play();
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PAUSE:
                          player.pause();
                          return true;
                      case KeyEvent.KEYCODE_DPAD_UP:
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                          view.showController();
                          return true;
                  }
                  return false;
              }

              boolean handleLiveKey(int code) {
                  if (code >= KeyEvent.KEYCODE_0 && code <= KeyEvent.KEYCODE_9) {
                      if (digits.length() < 5) digits += (char) ('0' + code - KeyEvent.KEYCODE_0);
                      showInfo("⌨  " + digits, 2000);
                      h.removeCallbacks(jumpRun);
                      h.postDelayed(jumpRun, 1500);
                      return true;
                  }
                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_UP:
                      case KeyEvent.KEYCODE_CHANNEL_UP:
                          play(index - 1);
                          return true;
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                      case KeyEvent.KEYCODE_CHANNEL_DOWN:
                          play(index + 1);
                          return true;
                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                          showInfo((index + 1) + ".  " + current().name, 3000);
                          return true;
                  }
                  return false;
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  if (player != null && e.getAction() == KeyEvent.ACTION_DOWN) {
                      boolean handled = vod ? handleVodKey(e.getKeyCode()) : handleLiveKey(e.getKeyCode());
                      if (handled) {
                          lastHandled = e.getKeyCode();
                          return true;
                      }
                  }
                  if (e.getAction() == KeyEvent.ACTION_UP && e.getKeyCode() == lastHandled) return true;
                  return super.dispatchKeyEvent(e);
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  if (player != null) player.play();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (player != null) player.pause();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  h.removeCallbacks(hideInfo);
                  h.removeCallbacks(jumpRun);
                  if (player != null) {
                      player.release();
                      player = null;
                  }
              }
          }
