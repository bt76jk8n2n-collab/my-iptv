                  adapter.notifyDataSetChanged();
                  list.setSelection(0);
                  updatePreview(0);
                  status.setText(title + "  •  " + shown.size());
                  if (focus) list.requestFocus();
              }

              void setPreview(String img, String emoji, String title, String sub) {
                  if (img != null && !img.isEmpty()) {
                      pvEmoji.setVisibility(View.GONE);
                      pvImage.setVisibility(View.VISIBLE);
                      Glide.with(this).load(img).fitCenter().into(pvImage);
                  } else {
                      Glide.with(this).clear(pvImage);
                      pvImage.setImageDrawable(null);
                      pvImage.setVisibility(View.GONE);
                      pvEmoji.setVisibility(View.VISIBLE);
                      pvEmoji.setText(emoji == null ? "" : emoji);
                  }
                  pvTitle.setText(title);
                  pvSub.setText(sub);
              }

              void updatePreview(int pos) {
                  if (pos < 0 || pos >= rows.size()) return;
                  if (level == LV_GROUPS) {
                      IconAdapter.Row r = rows.get(pos);
                      setPreview(r.icon, r.emoji, r.text, "اضغط OK لفتح القسم");
                  } else if (pos < shown.size()) {
                      Channel ch = shown.get(pos);
                      String sub;
                      if (level == LV_EPISODES) sub = savedTitle;
                      else if (section == Data.LIVE) sub = "قناة رقم " + (pos + 1) + "  •  " + ch.group;
                      else if (section == Data.SERIES) sub = ch.group + "  •  اضغط OK لعرض الحلقات";
                      else sub = ch.group;
                      setPreview(ch.logo, level == LV_EPISODES ? "▶" : TAB_EMOJI[section], ch.name, sub);
                  }
              }

              // ---------- التنقل ----------

              void openRow(int pos) {
                  if (pos < 0 || pos >= rows.size()) return;
                  if (level == LV_GROUPS) {
                      openGroup(pos);
                  } else if (level == LV_ITEMS && section == Data.SERIES) {
                      openSeries(pos);
                  } else {
                      play(shown, pos, section != Data.LIVE);
                  }
              }

              void openGroup(int pos) {
                  lastGroupPos = pos;
                  String key = groupKeys.get(pos);
                  List<Channel> src = Data.items.get(section);
                  shown.clear();
                  if (KEY_ALL.equals(key)) {
                      shown.addAll(src);
                  } else if (KEY_NEW.equals(key)) {
                      List<Channel> tmp = new ArrayList<>(src);
                      Collections.sort(tmp, (a, b) -> Long.compare(b.added, a.added));
                      shown.addAll(tmp.subList(0, Math.min(NEWEST_COUNT, tmp.size())));
                  } else {
                      for (Channel ch : src) if (key.equals(ch.group)) shown.add(ch);
                  }
                  showItems(LV_ITEMS, groupLabel(key), true);
              }

              void openSeries(final int pos) {
                  final Channel series = shown.get(pos);
                  status.setText("جاري تحميل حلقات: " + series.name + "...");
                  final Account acc = Account.read(this);
                  final int sec = section;
                  new Thread(() -> {
                      try {
                          final List<Channel> eps = Loader.loadEpisodes(acc, series.seriesId);
                          ui.post(() -> {
                              if (section != sec || level != LV_ITEMS) return;
                              savedItems.clear();
                              savedItems.addAll(shown);
                              savedTitle = series.name;
                              savedPos = pos;
                              for (Channel e : eps) if (e.logo == null || e.logo.isEmpty()) e.logo = series.logo;
                              shown.clear();
                              shown.addAll(eps);
                              showItems(LV_EPISODES, series.name, true);
                          });
                      } catch (Exception e) {
                          final String msg = e.getMessage();
                          ui.post(() -> status.setText("تعذر تحميل الحلقات: " + msg));
                      }
                  }).start();
              }

              void goBack() {
                  if (level == LV_EPISODES) {
                      shown.clear();
                      shown.addAll(savedItems);
                      String t = searchMode ? "نتائج البحث" : groupLabel(groupKeys.get(lastGroupPos));
                      showItems(LV_ITEMS, t, true);
                      list.setSelection(savedPos);
                      updatePreview(savedPos);
                  } else if (level == LV_ITEMS) {
                      if (searchMode) {
                          searchMode = false;
                          search.setText("");
                      }
                      showGroups();
                      list.requestFocus();
                  } else {
                      finish();
                  }
              }

              void runSearch() {
                  if (!Data.loaded[section]) return;
                  String q = norm(query());
                  if (q.isEmpty()) {
                      if (searchMode) showGroups();
                      return;
                  }
                  String[] words = q.split("\\s+");
                  shown.clear();
                  for (Channel ch : Data.items.get(section)) {
                      String n = norm(ch.name);
                      boolean ok = true;
                      for (String w : words) {
                          if (!n.contains(w)) {
                              ok = false;
                              break;
                          }
                      }
                      if (ok) shown.add(ch);
                  }
                  searchMode = true;
                  showItems(LV_ITEMS, "نتائج البحث", false);
              }

              void play(List<Channel> src, int pos, boolean vod) {
                  Data.current.clear();
                  Data.current.addAll(src);
                  Intent i = new Intent(this, PlayerActivity.class);
                  i.putExtra("index", pos);
                  i.putExtra("vod", vod);
                  startActivity(i);
              }

              // كتابة رقم القناة بالريموت مثل الرسيفر
              void jumpToNumber() {
                  int n = (int) Loader.num(digits);
                  digits = "";
                  if (section != Data.LIVE) return;
                  List<Channel> target = (level == LV_ITEMS && !searchMode) ? shown : Data.items.get(Data.LIVE);
                  if (n >= 1 && n <= target.size()) {
                      if (target == shown) list.setSelection(n - 1);
                      play(new ArrayList<>(target), n - 1, false);
                  } else {
                      status.setText("ما فيه قناة بهالرقم");
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent e) {
                  boolean typing = getCurrentFocus() instanceof EditText;
                  if (!typing && section == Data.LIVE && keyCode >= KeyEvent.KEYCODE_0 && keyCode <= KeyEvent.KEYCODE_9) {
                      if (digits.length() < 5) digits += (char) ('0' + keyCode - KeyEvent.KEYCODE_0);
                      status.setText("رقم القناة: " + digits);
                      ui.removeCallbacks(jumpRun);
                      ui.postDelayed(jumpRun, 1500);
                      return true;
                  }
                  if (!typing && keyCode == KeyEvent.KEYCODE_SEARCH) {
                      search.requestFocus();
                      return true;
                  }
                  return super.onKeyDown(keyCode, e);
              }

              @Override
              public void onBackPressed() {
                  if (getCurrentFocus() instanceof EditText && level == LV_GROUPS) {
                      list.requestFocus();
                      return;
                  }
                  if (level != LV_GROUPS) {
                      goBack();
                      return;
                  }
                  super.onBackPressed();
              }
          }
          EOF

          cat > app/src/main/java/com/my/iptv/PlayerActivity.java <<'EOF'
          package com.my.iptv;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.datasource.DefaultDataSource;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;

          import java.util.ArrayList;
          import java.util.List;

          public class PlayerActivity extends Activity {
              ExoPlayer player;
              PlayerView view;
              TextView info;
              int index;
              boolean vod;
              String digits = "";
              int lastHandled = -1;
              final List<MediaItem> tries = new ArrayList<>();
              int tryIndex;
              final Handler h = new Handler(Looper.getMainLooper());
              final Runnable hideInfo = () -> info.setVisibility(View.GONE);
              final Runnable jumpRun = this::jumpToNumber;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Data.current.isEmpty()) {
                      finish();
                      return;
                  }
                  index = getIntent().getIntExtra("index", 0);
                  vod = getIntent().getBooleanExtra("vod", false);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  view = new PlayerView(this);
                  view.setUseController(vod);
                  view.setControllerShowTimeoutMs(4000);
                  root.addView(view, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  info = new TextView(this);
                  info.setTextColor(Color.WHITE);
                  info.setTextSize(26);
                  info.setBackgroundColor(0xCC000000);
                  info.setPadding(40, 24, 40, 24);
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.START);
                  lp.setMargins(48, 48, 48, 48);
                  root.addView(info, lp);
                  setContentView(root);

                  DefaultHttpDataSource.Factory http = new DefaultHttpDataSource.Factory()
                          .setUserAgent(Loader.UA)
                          .setAllowCrossProtocolRedirects(true)
                          .setConnectTimeoutMs(20000)
                          .setReadTimeoutMs(30000);
                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(new DefaultMediaSourceFactory(this)
                                  .setDataSourceFactory(new DefaultDataSource.Factory(this, http)))
                          .setSeekBackIncrementMs(10000)
                          .setSeekForwardIncrementMs(30000)
                          .build();
                  view.setPlayer(player);
                  player.addListener(new Player.Listener() {
                      @Override
                      public void onPlayerError(PlaybackException e) {
                          if (e.errorCode == PlaybackException.ERROR_CODE_BEHIND_LIVE_WINDOW) {
                              player.seekToDefaultPosition();
                              player.prepare();
                              return;
                          }
                          tryIndex++;
                          if (tryIndex < tries.size()) {
                              startTry();
                          } else {
                              showInfo("تعذر التشغيل: " + current().name, 6000);
                          }
                      }
                  });
                  play(index);
              }

              Channel current() {
                  return Data.current.get(index);
              }

              void play(int i) {
                  int n = Data.current.size();
                  index = ((i % n) + n) % n;
                  Channel c = current();
                  tries.clear();
                  tries.add(MediaItem.fromUri(c.url));
                  if (c.altUrl != null) tries.add(MediaItem.fromUri(c.altUrl));
                  if (!vod && !c.url.contains(".m3u8")) {
                      tries.add(new MediaItem.Builder().setUri(c.url).setMimeType(MimeTypes.APPLICATION_M3U8).build());
                  }
                  tryIndex = 0;
                  startTry();
                  showInfo(vod ? c.name : (index + 1) + ".  " + c.name, 3000);
              }

              void startTry() {
                  player.setMediaItem(tries.get(tryIndex));
                  player.prepare();
                  player.play();
              }

              void showInfo(String text, long ms) {
                  info.setText(text);
                  info.setVisibility(View.VISIBLE);
                  h.removeCallbacks(hideInfo);
                  h.postDelayed(hideInfo, ms);
              }

              void jumpToNumber() {
                  int n = (int) Loader.num(digits);
                  digits = "";
                  if (n >= 1 && n <= Data.current.size()) play(n - 1);
                  else showInfo("ما فيه قناة بهالرقم", 2000);
              }

              boolean handleVodKey(int code) {
                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_LEFT:
                      case KeyEvent.KEYCODE_MEDIA_REWIND:
                          player.seekBack();
                          view.showController();
                          return true;
                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD:
                          player.seekForward();
                          view.showController();
                          return true;
                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                      case KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                          player.setPlayWhenReady(!player.getPlayWhenReady());
                          view.showController();
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PLAY:
                          player.play();
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PAUSE:
                          player.pause();
                          return true;
                      case KeyEvent.KEYCODE_DPAD_UP:
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                          view.showController();
                          return true;
                  }
                  return false;
              }

              boolean handleLiveKey(int code) {
                  if (code >= KeyEvent.KEYCODE_0 && code <= KeyEvent.KEYCODE_9) {
                      if (digits.length() < 5) digits += (char) ('0' + code - KeyEvent.KEYCODE_0);
                      showInfo("⌨  " + digits, 2000);
                      h.removeCallbacks(jumpRun);
                      h.postDelayed(jumpRun, 1500);
                      return true;
                  }
                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_UP:
                      case KeyEvent.KEYCODE_CHANNEL_UP:
                          play(index - 1);
                          return true;
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                      case KeyEvent.KEYCODE_CHANNEL_DOWN:
                          play(index + 1);
                          return true;
                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                          showInfo((index + 1) + ".  " + current().name, 3000);
                          return true;
                  }
                  return false;
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  if (player != null && e.getAction() == KeyEvent.ACTION_DOWN) {
                      boolean handled = vod ? handleVodKey(e.getKeyCode()) : handleLiveKey(e.getKeyCode());
                      if (handled) {
                          lastHandled = e.getKeyCode();
                          return true;
                      }
                  }
                  if (e.getAction() == KeyEvent.ACTION_UP && e.getKeyCode() == lastHandled) return true;
                  return super.dispatchKeyEvent(e);
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  if (player != null) player.play();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (player != null) player.pause();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  h.removeCallbacks(hideInfo);
                  h.removeCallbacks(jumpRun);
                  if (player != null) {
                      player.release();
                      player = null;
                  }
              }
          }
          EOF

      - name: Custom app icon (upload icon.png or icon.jpg to the repo)
        working-directory: p
        run: |
          IMG=$(ls ../icon.png ../icon.jpg ../icon.jpeg ../icon.webp ../Icon.png ../Icon.jpg ../ICON.PNG ../ICON.JPG 2>/dev/null | head -1)
          if [ -n "$IMG" ]; then
            echo "Using $IMG as app icon"
            command -v convert >/dev/null || (sudo apt-get update && sudo apt-get install -y imagemagick)
            rm -f app/src/main/res/drawable/icon.xml app/src/main/res/drawable/banner.xml
            mkdir -p app/src/main/res/drawable-nodpi
            convert "$IMG[0]" -auto-orient -resize 512x512^ -gravity center -extent 512x512 app/src/main/res/drawable-nodpi/icon.png
            convert "$IMG[0]" -auto-orient -resize 640x360 -background "#101820" -gravity center -extent 640x360 app/src/main/res/drawable-nodpi/banner.png
          else
            echo "No icon.png in repo - using default icon"
          fi

      - name: Build APK
        working-directory: p
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore/iptv.jks" gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp p/app/build/outputs/apk/debug/app-debug.apk iptv.apk
          gh release create "v${{ github.run_number }}" iptv.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "IPTV v${{ github.run_number }}" \
            --notes "APK للتلفزيون"
