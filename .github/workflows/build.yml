              void hideKeyboard() {
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null) imm.hideSoftInputFromWindow(search.getWindowToken(), 0);
              }

              String query() {
                  return search.getText().toString().trim();
              }

              static String norm(String s) {
                  s = s.toLowerCase();
                  StringBuilder sb = new StringBuilder(s.length());
                  for (int i = 0; i < s.length(); i++) {
                      char ch = s.charAt(i);
                      switch (ch) {
                          case 'أ': case 'إ': case 'آ': ch = 'ا'; break;
                          case 'ة': ch = 'ه'; break;
                          case 'ى': ch = 'ي'; break;
                          case 'ؤ': ch = 'و'; break;
                          case 'ئ': ch = 'ي'; break;
                          case '_': case '-': case '.': ch = ' '; break;
                      }
                      if (ch >= 'ً' && ch <= 'ْ') continue;
                      sb.append(ch);
                  }
                  return sb.toString();
              }

              // ---------- التبويبات والتحميل ----------

              void switchSection(int sec) {
                  stopPreview();
                  section = sec;
                  searchMode = false;
                  for (int i = 0; i < 3; i++) tabs[i].setSelected(i == sec);
                  if (!query().isEmpty()) search.setText("");
                  groupKeys.clear();
                  rows.clear();
                  shown.clear();
                  adapter.notifyDataSetChanged();
                  backBtn.setVisibility(View.GONE);
                  level = LV_GROUPS;
                  setPreview(null, TAB_EMOJI[sec], TAB_NAMES[sec], "");
                  if (Data.loaded[sec]) onDataReady();
                  else load(sec);
              }

              void load(final int sec) {
                  if (loading[sec]) return;
                  loading[sec] = true;
                  if (sec == section) status.setText("جاري تحميل " + TAB_NAMES[sec] + "...");
                  final Account acc = Account.read(this);
                  new Thread(() -> {
                      try {
                          final Loader.Result r = Loader.loadSection(sec, acc);
                          ui.post(() -> {
                              loading[sec] = false;
                              Data.groups.get(sec).clear();
                              Data.groups.get(sec).addAll(r.groups);
                              Data.items.get(sec).clear();
                              Data.items.get(sec).addAll(r.items);
                              Data.loaded[sec] = true;
                              if (sec == section) onDataReady();
                          });
                      } catch (Exception e) {
                          final String msg = e.getMessage();
                          ui.post(() -> {
                              loading[sec] = false;
                              if (sec == section) status.setText("تعذر التحميل: " + msg + " — اضغط تحديث أو غيّر الحساب من الإعدادات");
                          });
                      }
                  }).start();
              }

              void refreshVisible() {
                  Set<String> hid = Store.hidden(this, section);
                  visible.clear();
                  byKey.clear();
                  groupIcon.clear();
                  groupCount.clear();
                  for (Channel ch : Data.items.get(section)) {
                      byKey.put(Store.keyOf(ch), ch);
                      if (hid.contains(ch.group)) continue;
                      visible.add(ch);
                      Integer c = groupCount.get(ch.group);
                      groupCount.put(ch.group, c == null ? 1 : c + 1);
                      if (!groupIcon.containsKey(ch.group) && ch.logo != null && !ch.logo.isEmpty()) {
                          groupIcon.put(ch.group, ch.logo);
                      }
                  }
                  favKeys.clear();
                  for (Channel f : Store.favs(this, section)) favKeys.add(Store.keyOf(f));
              }

              void rebuildGroupKeys() {
                  groupKeys.clear();
                  if (section != Data.LIVE && !Store.cw(this, section).isEmpty()) groupKeys.add(KEY_CW);
                  if (!favKeys.isEmpty()) groupKeys.add(KEY_FAV);
                  groupKeys.add(KEY_ALL);
                  if (section != Data.LIVE) groupKeys.add(KEY_NEW);
                  Set<String> hid = Store.hidden(this, section);
                  for (String g : Data.groups.get(section)) if (!hid.contains(g)) groupKeys.add(g);
                  if (!hid.isEmpty()) groupKeys.add(KEY_HIDDEN);
              }

              void onDataReady() {
                  refreshVisible();
                  rebuildGroupKeys();
                  String def;
                  if (section == Data.LIVE) def = favKeys.isEmpty() ? KEY_ALL : KEY_FAV;
                  else def = groupKeys.contains(KEY_CW) ? KEY_CW : KEY_NEW;
                  lastGroupPos = Math.max(0, groupKeys.indexOf(def));
                  showGroups();
                  list.requestFocus();
                  if (section == Data.LIVE) maybeAutoPlay();
              }

              // يفتح آخر قناة كنت عليها
              void maybeAutoPlay() {
                  if (autoStartDone) return;
                  autoStartDone = true;
                  if (!Store.opt(this, "resume_last", true)) return;
                  Channel last = Store.lastLive(this);
                  if (last == null) return;
                  Channel cur = byKey.get(Store.keyOf(last));
                  if (cur == null || !visible.contains(cur)) return;
                  int gi = groupKeys.indexOf(cur.group);
                  List<Channel> target;
                  if (gi >= 0) {
                      openGroup(gi);
                      target = new ArrayList<>(shown);
                  } else {
                      target = new ArrayList<>(visible);
                  }
                  int idx = target.indexOf(cur);
                  if (idx < 0) return;
                  if (gi >= 0) list.setSelection(idx);
                  play(target, idx, false, false);
              }

              // ---------- العرض ----------

              String groupLabel(String key) {
                  if (KEY_ALL.equals(key)) return "الكل (" + visible.size() + ")";
                  if (KEY_NEW.equals(key)) return "الأحدث";
                  if (KEY_FAV.equals(key)) return "المفضلة (" + favKeys.size() + ")";
                  if (KEY_CW.equals(key)) return "أكمل المشاهدة";
                  if (KEY_HIDDEN.equals(key)) return "الأقسام المخفية (" + Store.hidden(this, section).size() + ")";
                  Integer c = groupCount.get(key);
                  return key + "  (" + (c == null ? 0 : c) + ")";
              }

              IconAdapter.Row groupRow(String key) {
                  if (KEY_ALL.equals(key)) return new IconAdapter.Row(groupLabel(key), null, TAB_EMOJI[section]);
                  if (KEY_NEW.equals(key)) return new IconAdapter.Row(groupLabel(key), null, "🆕");
                  if (KEY_FAV.equals(key)) return new IconAdapter.Row(groupLabel(key), null, "⭐");
                  if (KEY_CW.equals(key)) return new IconAdapter.Row(groupLabel(key), null, "▶️");
                  if (KEY_HIDDEN.equals(key)) return new IconAdapter.Row(groupLabel(key), null, "🙈");
                  String flag = Flags.find(key);
                  if (flag != null) return new IconAdapter.Row(groupLabel(key), null, flag);
                  return new IconAdapter.Row(groupLabel(key), groupIcon.get(key), TAB_EMOJI[section]);
              }

              void showGroups() {
                  level = LV_GROUPS;
                  searchMode = false;
                  backBtn.setVisibility(View.GONE);
                  rows.clear();
                  for (String k : groupKeys) rows.add(groupRow(k));
                  adapter.notifyDataSetChanged();
                  int pos = Math.min(lastGroupPos, Math.max(0, rows.size() - 1));
                  list.setSelection(pos);
                  updatePreview(pos);
                  status.setText(TAB_NAMES[section] + "  •  " + Data.groups.get(section).size() + " قسم  •  " + visible.size()
                          + "  •  ضغطة طويلة على أي شي للخيارات");
              }

              void showItems(int lvl, String title, boolean focus) {
                  level = lvl;
                  itemsTitle = title;
                  backBtn.setVisibility(View.VISIBLE);
                  backBtn.setText(lvl == LV_EPISODES ? "⬅  رجوع للمسلسلات" : (searchMode ? "⬅  إلغاء البحث" : "⬅  رجوع للأقسام"));
                  rows.clear();
                  boolean cwSeries = KEY_CW.equals(currentKey) && section == Data.SERIES && lvl == LV_ITEMS && !searchMode;
                  for (int i = 0; i < shown.size(); i++) {
                      Channel ch = shown.get(i);
                      String text = ch.name;
                      if (cwSeries && ch.group != null) text = ch.group + "  •  " + ch.name;
                      if (section == Data.LIVE && lvl == LV_ITEMS) text = (i + 1) + ".  " + text;
                      if (lvl == LV_ITEMS && favKeys.contains(Store.keyOf(ch))) text = text + "  ⭐";
                      rows.add(new IconAdapter.Row(text, ch.logo, lvl == LV_EPISODES ? "▶" : TAB_EMOJI[section]));
                  }
                  adapter.notifyDataSetChanged();
                  list.setSelection(0);
                  updatePreview(0);
                  status.setText(title + "  •  " + shown.size());
                  if (focus) list.requestFocus();
              }

              void showHidden() {
                  level = LV_HIDDEN;
                  hiddenList.clear();
                  hiddenList.addAll(Store.hidden(this, section));
                  Collections.sort(hiddenList);
                  backBtn.setVisibility(View.VISIBLE);
                  backBtn.setText("⬅  رجوع للأقسام");
                  rows.clear();
                  for (String g : hiddenList) {
                      String flag = Flags.find(g);
                      rows.add(new IconAdapter.Row(g, flag == null ? groupIconAll(g) : null, flag == null ? "🙈" : flag));
                  }
                  adapter.notifyDataSetChanged();
                  list.setSelection(0);
                  updatePreview(0);
                  status.setText("اضغط OK على أي قسم عشان يرجع يطلع");
                  list.requestFocus();
              }

              String groupIconAll(String g) {
                  for (Channel ch : Data.items.get(section)) {
                      if (g.equals(ch.group) && ch.logo != null && !ch.logo.isEmpty()) return ch.logo;
                  }
                  return null;
              }

              void setPreview(String img, String emoji, String title, String sub) {
                  if (img != null && !img.isEmpty()) {
                      pvEmoji.setVisibility(View.GONE);
                      pvImage.setVisibility(View.VISIBLE);
                      Glide.with(this).load(img).transition(DrawableTransitionOptions.withCrossFade(220)).fitCenter().into(pvImage);
                  } else {
                      Glide.with(this).clear(pvImage);
                      pvImage.setImageDrawable(null);
                      pvImage.setVisibility(View.GONE);
                      pvEmoji.setVisibility(View.VISIBLE);
                      pvEmoji.setText(emoji == null ? "" : emoji);
                  }
                  pvTitle.setText(title);
                  pvSub.setText(sub);
              }

              void updatePreview(int pos) {
                  epgToken++;
                  pvEpg.setText("");
                  pvEpgBox.setVisibility(View.GONE);
                  if (pos < 0 || pos >= rows.size()) {
                      stopPreview();
                      return;
                  }
                  if (level == LV_GROUPS || level == LV_HIDDEN) {
                      stopPreview();
                      IconAdapter.Row r = rows.get(pos);
                      setPreview(r.icon, r.emoji, r.text, level == LV_GROUPS ? "اضغط OK لفتح القسم" : "اضغط OK لإظهار القسم");
                      return;
                  }
                  if (pos >= shown.size()) return;
                  Channel ch = shown.get(pos);
                  String sub;
                  if (level == LV_EPISODES) sub = savedTitle;
                  else if (section == Data.LIVE) sub = "قناة رقم " + (pos + 1) + "  •  " + ch.group;
                  else if (section == Data.SERIES && !KEY_CW.equals(currentKey)) sub = ch.group + "  •  اضغط OK لعرض الحلقات";
                  else sub = ch.group == null ? "" : ch.group;
                  long saved = Store.getPos(this, ch.url);
                  if (section != Data.LIVE && saved > 30000) sub = sub + "\nوقفت عند " + PlayerActivity.fmt(saved);
                  setPreview(ch.logo, level == LV_EPISODES ? "▶" : TAB_EMOJI[section], ch.name, sub);
                  if (section == Data.LIVE) {
                      schedulePreview(ch);
                      loadEpg(ch);
                  } else {
                      stopPreview();
                  }
              }

              // ---------- المعاينة ودليل البرامج ----------

              void schedulePreview(Channel ch) {
                  ui.removeCallbacks(previewRun);
                  if (!Store.opt(this, "preview", true)) {
                      stopPreview();
                      return;
                  }
                  if (ch == previewCh && pvVideo.getVisibility() == View.VISIBLE) return;
                  stopPreview();
                  previewCh = ch;
                  ui.postDelayed(previewRun, 900);
              }

              void startPreview() {
                  if (previewCh == null || isFinishing()) return;
                  if (preview == null) {
                      preview = Players.create(this);
                      preview.addListener(new Player.Listener() {
                          @Override
                          public void onPlayerError(PlaybackException e) {
                              previewTry++;
                              if (preview != null && previewTry < previewTries.size()) {
                                  preview.setMediaItem(previewTries.get(previewTry));
                                  preview.prepare();
                                  preview.play();
                              } else {
                                  pvVideo.setVisibility(View.GONE);
                                  liveBadge.setVisibility(View.GONE);
                              }
                          }
                      });
                      pvVideo.setPlayer(preview);
                  }
                  previewTries = Players.tries(previewCh, false);
                  previewTry = 0;
                  pvVideo.setVisibility(View.VISIBLE);
                  liveBadge.setVisibility(View.VISIBLE);
                  preview.setMediaItem(previewTries.get(0));
                  preview.prepare();
                  preview.play();
              }

              void stopPreview() {
                  ui.removeCallbacks(previewRun);
                  previewCh = null;
                  if (preview != null) {
                      preview.stop();
                      preview.clearMediaItems();
                  }
                  if (pvVideo != null) pvVideo.setVisibility(View.GONE);
                  if (liveBadge != null) liveBadge.setVisibility(View.GONE);
              }

              void releasePreview() {
                  stopPreview();
                  if (preview != null) {
                      pvVideo.setPlayer(null);
                      preview.release();
                      preview = null;
                  }
              }

              void loadEpg(final Channel ch) {
                  final int tok = epgToken;
                  final Account acc = Account.read(this);
                  ui.postDelayed(() -> {
                      if (tok != epgToken) return;
                      new Thread(() -> {
                          Epg.Info t;
                          try {
                              t = Epg.nowNext(acc, ch);
                          } catch (Exception e) {
                              t = Epg.EMPTY;
                          }
                          final Epg.Info fin = t;
                          ui.post(() -> {
                              if (tok != epgToken || fin.text.isEmpty()) return;
                              pvEpg.setText(fin.text);
                              int pc = fin.percent();
                              pvProgress.setVisibility(pc >= 0 ? View.VISIBLE : View.GONE);
                              if (pc >= 0) pvProgress.setProgress(pc);
                              pvEpgBox.setVisibility(View.VISIBLE);
                          });
                      }).start();
                  }, 500);
              }

              // ---------- التنقل ----------

              List<Channel> itemsFor(String key) {
                  List<Channel> out = new ArrayList<>();
                  if (KEY_ALL.equals(key)) {
                      out.addAll(visible);
                  } else if (KEY_NEW.equals(key)) {
                      List<Channel> tmp = new ArrayList<>(visible);
                      Collections.sort(tmp, (a, b) -> Long.compare(b.added, a.added));
                      out.addAll(tmp.subList(0, Math.min(NEWEST_COUNT, tmp.size())));
                  } else if (KEY_FAV.equals(key)) {
                      for (Channel f : Store.favs(this, section)) {
                          Channel cur = byKey.get(Store.keyOf(f));
                          out.add(cur != null ? cur : f);
                      }
                  } else if (KEY_CW.equals(key)) {
                      out.addAll(Store.cw(this, section));
                  } else {
                      for (Channel ch : visible) if (key.equals(ch.group)) out.add(ch);
                  }
                  return out;
              }

              void openRow(int pos) {
                  if (pos < 0 || pos >= rows.size()) return;
                  if (level == LV_GROUPS) {
                      openGroup(pos);
                  } else if (level == LV_HIDDEN) {
                      String g = hiddenList.get(pos);
                      Store.setHidden(this, section, g, false);
                      toast("رجع القسم: " + g);
                      refreshVisible();
                      rebuildGroupKeys();
                      if (Store.hidden(this, section).isEmpty()) showGroups();
                      else showHidden();
                  } else if (level == LV_ITEMS && section == Data.SERIES && !KEY_CW.equals(currentKey)) {
                      openSeries(pos);
                  } else if (level == LV_ITEMS && section == Data.SERIES) {
                      playEpisodeFromCw(shown.get(pos));
                  } else {
                      play(shown, pos, section != Data.LIVE, level == LV_EPISODES);
                  }
              }

              void openGroup(int pos) {
                  lastGroupPos = pos;
                  String key = groupKeys.get(pos);
                  if (KEY_HIDDEN.equals(key)) {
                      showHidden();
                      return;
                  }
                  currentKey = key;
                  shown.clear();
                  shown.addAll(itemsFor(key));
                  showItems(LV_ITEMS, groupLabel(key), true);
              }

              void reopenCurrent(int sel) {
                  shown.clear();
                  shown.addAll(itemsFor(currentKey));
                  if (shown.isEmpty()) {
                      lastGroupPos = Math.max(0, groupKeys.indexOf(KEY_ALL));
                      showGroups();
                      list.requestFocus();
                      return;
                  }
                  showItems(LV_ITEMS, groupLabel(currentKey), true);
                  int s = Math.max(0, Math.min(sel, shown.size() - 1));
                  list.setSelection(s);
                  updatePreview(s);
              }

              void openSeries(final int pos) {
                  final Channel series = shown.get(pos);
                  status.setText("جاري تحميل حلقات: " + series.name + "...");
                  final Account acc = Account.read(this);
                  final int sec = section;
                  new Thread(() -> {
                      try {
                          final List<Channel> eps = Loader.loadEpisodes(acc, series.seriesId);
                          ui.post(() -> {
                              if (section != sec || level != LV_ITEMS) return;
                              savedItems.clear();
                              savedItems.addAll(shown);
                              savedTitle = series.name;
                              savedPos = pos;
                              for (Channel e : eps) {
                                  if (e.logo == null || e.logo.isEmpty()) e.logo = series.logo;
                                  e.group = series.name;
                              }
                              shown.clear();
                              shown.addAll(eps);
                              showItems(LV_EPISODES, series.name, true);
                          });
                      } catch (Exception e) {
                          final String msg = e.getMessage();
                          ui.post(() -> status.setText("تعذر تحميل الحلقات: " + msg));
                      }
                  }).start();
              }

              // يكمل الحلقة من «أكمل المشاهدة» ومعها باقي حلقات المسلسل عشان «الحلقة التالية» تشتغل
              void playEpisodeFromCw(final Channel ep) {
                  if (ep.seriesId == null) {
                      List<Channel> one = new ArrayList<>();
                      one.add(ep);
                      play(one, 0, true, false);
                      return;
                  }
                  status.setText("جاري التحميل...");
                  final Account acc = Account.read(this);
                  new Thread(() -> {
                      List<Channel> eps;
                      try {
                          eps = Loader.loadEpisodes(acc, ep.seriesId);
                      } catch (Exception e) {
                          eps = new ArrayList<>();
                      }
                      final List<Channel> fin = eps;
                      ui.post(() -> {
                          int idx = -1;
                          for (int i = 0; i < fin.size(); i++) {
                              Channel e = fin.get(i);
                              e.group = ep.group;
                              if (e.logo == null || e.logo.isEmpty()) e.logo = ep.logo;
                              if (e.url != null && e.url.equals(ep.url)) idx = i;
                          }
                          status.setText(itemsTitle + "  •  " + shown.size());
                          if (idx < 0) {
                              List<Channel> one = new ArrayList<>();
                              one.add(ep);
                              play(one, 0, true, false);
                          } else {
                              play(fin, idx, true, true);
                          }
                      });
                  }).start();
              }

              void goBack() {
                  if (level == LV_EPISODES) {
                      shown.clear();
                      shown.addAll(savedItems);
                      String t = searchMode ? "نتائج البحث" : groupLabel(currentKey);
                      showItems(LV_ITEMS, t, true);
                      list.setSelection(savedPos);
                      updatePreview(savedPos);
                  } else if (level == LV_ITEMS || level == LV_HIDDEN) {
                      if (searchMode) {
                          searchMode = false;
                          search.setText("");
                      }
                      int i = groupKeys.indexOf(level == LV_HIDDEN ? KEY_HIDDEN : currentKey);
                      if (i >= 0) lastGroupPos = i;
                      showGroups();
                      list.requestFocus();
                  } else {
                      finish();
                  }
              }

              void runSearch() {
                  if (!Data.loaded[section]) return;
                  String q = norm(query());
                  if (q.isEmpty()) {
                      if (searchMode) showGroups();
                      return;
                  }
                  String[] words = q.split("\\s+");
                  shown.clear();
                  for (Channel ch : visible) {
                      String n = norm(ch.name);
                      boolean ok = true;
                      for (String w : words) {
                          if (!n.contains(w)) {
                              ok = false;
                              break;
                          }
                      }
                      if (ok) shown.add(ch);
                  }
                  searchMode = true;
                  currentKey = KEY_ALL;
                  showItems(LV_ITEMS, "نتائج البحث", false);
              }

              // ---------- الضغطة الطويلة ----------

              void onLongPress(final int pos) {
                  if (level == LV_GROUPS) {
                      final String key = groupKeys.get(pos);
                      if (key.startsWith("\u0000")) return;
                      new AlertDialog.Builder(this)
                              .setTitle(key)
                              .setItems(new String[]{"🙈  إخفاء هذا القسم"}, (d, w) -> {
                                  Store.setHidden(this, section, key, true);
                                  refreshVisible();
                                  rebuildGroupKeys();
                                  lastGroupPos = Math.min(pos, groupKeys.size() - 1);
                                  showGroups();
                                  toast("انخفى القسم — ترجعه من «الأقسام المخفية» تحت");
                              })
                              .show();
                      return;
                  }
                  if (level != LV_ITEMS || pos >= shown.size()) return;
                  final Channel ch = shown.get(pos);
                  List<String> opts = new ArrayList<>();
                  final List<Runnable> acts = new ArrayList<>();
                  if (KEY_CW.equals(currentKey) && !searchMode) {
                      opts.add("✖  إزالة من «أكمل المشاهدة»");
                      acts.add(() -> {
                          Store.removeCw(this, section, ch.url);
                          Store.setPos(this, ch.url, 0);
                          rebuildGroupKeys();
                          reopenCurrent(pos);
                      });
                  } else if (!favKeys.contains(Store.keyOf(ch))) {
                      opts.add("⭐  إضافة للمفضلة");
                      acts.add(() -> {
                          Store.addFav(this, section, ch);
                          afterFavChange(pos);
                          toast("انضافت للمفضلة");
                      });
                  } else {
                      opts.add("✖  إزالة من المفضلة");
                      acts.add(() -> {
                          Store.removeFav(this, section, ch);
                          afterFavChange(pos);
                      });
                      if (KEY_FAV.equals(currentKey) && !searchMode) {
                          if (pos > 0) {
                              opts.add("⬆  تحريك لفوق");
                              acts.add(() -> {
                                  Store.moveFav(this, section, pos, pos - 1);
                                  reopenCurrent(pos - 1);
                              });
                          }
                          if (pos < shown.size() - 1) {
                              opts.add("⬇  تحريك لتحت");
                              acts.add(() -> {
                                  Store.moveFav(this, section, pos, pos + 1);
                                  reopenCurrent(pos + 1);
                              });
                          }
                      }
                  }
                  new AlertDialog.Builder(this)
                          .setTitle(ch.name)
                          .setItems(opts.toArray(new String[0]), (d, w) -> acts.get(w).run())
                          .show();
              }

              void afterFavChange(int pos) {
                  favKeys.clear();
                  for (Channel f : Store.favs(this, section)) favKeys.add(Store.keyOf(f));
                  rebuildGroupKeys();
                  if (KEY_FAV.equals(currentKey) && !searchMode) {
                      reopenCurrent(pos);
                  } else {
                      showItems(LV_ITEMS, itemsTitle, true);
                      list.setSelection(pos);
                      updatePreview(pos);
                  }
              }

              // ---------- التشغيل ----------

              void play(List<Channel> src, int pos, boolean vod, boolean series) {
                  releasePreview();
                  Data.current.clear();
                  Data.current.addAll(src);
                  Intent i = new Intent(this, PlayerActivity.class);
                  i.putExtra("index", pos);
                  i.putExtra("vod", vod);
                  i.putExtra("series", series);
                  i.putExtra("section", section);
                  startActivity(i);
              }

              void jumpToNumber() {
                  int n = (int) Loader.num(digits);
                  digits = "";
                  if (section != Data.LIVE) return;
                  List<Channel> target = (level == LV_ITEMS && !searchMode) ? shown : visible;
                  if (n >= 1 && n <= target.size()) {
                      if (target == shown) list.setSelection(n - 1);
                      play(new ArrayList<>(target), n - 1, false, false);
                  } else {
                      status.setText("ما فيه قناة بهالرقم");
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  ui.removeCallbacks(clockRun);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (clock != null) {
                      ui.removeCallbacks(clockRun);
                      clockRun.run();
                  }
                  if (adapter == null || !Data.loaded[section]) return;
                  refreshVisible();
                  rebuildGroupKeys();
                  if (level == LV_GROUPS) {
                      showGroups();
                  } else if (level == LV_ITEMS && KEY_CW.equals(currentKey) && !searchMode) {
                      reopenCurrent(list.getSelectedItemPosition());
                  } else {
                      updatePreview(list.getSelectedItemPosition());
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  releasePreview();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent e) {
                  boolean typing = getCurrentFocus() instanceof EditText;
                  if (!typing && section == Data.LIVE && keyCode >= KeyEvent.KEYCODE_0 && keyCode <= KeyEvent.KEYCODE_9) {
                      if (digits.length() < 5) digits += (char) ('0' + keyCode - KeyEvent.KEYCODE_0);
                      status.setText("رقم القناة: " + digits);
                      ui.removeCallbacks(jumpRun);
                      ui.postDelayed(jumpRun, 1500);
                      return true;
                  }
                  if (!typing && keyCode == KeyEvent.KEYCODE_SEARCH) {
                      search.requestFocus();
                      return true;
                  }
                  if (!typing && keyCode == KeyEvent.KEYCODE_MENU) {
                      int p = list.getSelectedItemPosition();
                      if (p >= 0) onLongPress(p);
                      return true;
                  }
                  return super.onKeyDown(keyCode, e);
              }

              @Override
              public void onBackPressed() {
                  if (getCurrentFocus() instanceof EditText && level == LV_GROUPS) {
                      list.requestFocus();
                      return;
                  }
                  if (level != LV_GROUPS) {
                      goBack();
                      return;
                  }
                  super.onBackPressed();
              }
          }
