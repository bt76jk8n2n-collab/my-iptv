          cat > app/src/main/java/com/my/iptv/Epg.java <<'EOF'
          package com.my.iptv;

          import android.util.Base64;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          // دليل البرامج: وش شغال الحين ووش بعده
          public class Epg {
              public static class Info {
                  public String text = "";
                  public long start;
                  public long end;

                  public int percent() {
                      long now = System.currentTimeMillis() / 1000;
                      if (end <= start || now < start) return -1;
                      return (int) Math.min(100, (now - start) * 100 / (end - start));
                  }
              }

              static final Info EMPTY = new Info();
              static final Map<String, Info> cache = new HashMap<>();
              static final Map<String, Long> when = new HashMap<>();
              static final long TTL = 10 * 60 * 1000;

              static String streamIdOf(Channel ch) {
                  if (ch.streamId != null && !ch.streamId.isEmpty()) return ch.streamId;
                  if (ch.url == null) return null;
                  String u = ch.url;
                  int q = u.indexOf('?');
                  if (q >= 0) u = u.substring(0, q);
                  int s = u.lastIndexOf('/');
                  if (s < 0) return null;
                  String last = u.substring(s + 1);
                  int d = last.indexOf('.');
                  if (d >= 0) last = last.substring(0, d);
                  if (last.isEmpty()) return null;
                  for (int i = 0; i < last.length(); i++) {
                      char x = last.charAt(i);
                      if (x < '0' || x > '9') return null;
                  }
                  return last;
              }

              public static Info nowNext(Account a, Channel ch) throws Exception {
                  String[] c = Loader.creds(a);
                  if (c == null) return EMPTY;
                  String id = streamIdOf(ch);
                  if (id == null) return EMPTY;
                  synchronized (cache) {
                      Long t = when.get(id);
                      if (t != null && System.currentTimeMillis() - t < TTL) return cache.get(id);
                  }
                  String body = Loader.readAll(Loader.api(c, "get_short_epg") + "&stream_id=" + id + "&limit=4");
                  Info res = new Info();
                  if (body.startsWith("{")) {
                      JSONObject o = new JSONObject(body);
                      JSONArray l = o.optJSONArray("epg_listings");
                      StringBuilder sb = new StringBuilder();
                      long now = System.currentTimeMillis() / 1000;
                      int n = 0;
                      if (l != null) {
                          for (int i = 0; i < l.length() && n < 2; i++) {
                              JSONObject e = l.getJSONObject(i);
                              long st = Loader.num(e.optString("start_timestamp", "0"));
                              long en = Loader.num(e.optString("stop_timestamp", "0"));
                              if (en > 0 && en < now) continue;
                              String title = dec(e.optString("title", ""));
                              if (title.isEmpty()) continue;
                              if (n == 0) {
                                  res.start = st;
                                  res.end = en;
                              }
                              if (sb.length() > 0) sb.append('\n');
                              sb.append(n == 0 ? "الآن: " : "التالي: ").append(title);
                              if (st > 0) {
                                  sb.append("  (").append(hm(st));
                                  if (n == 0 && en > 0) sb.append(" - ").append(hm(en));
                                  sb.append(")");
                              }
                              n++;
                          }
                      }
                      res.text = sb.toString();
                  }
                  synchronized (cache) {
                      cache.put(id, res);
                      when.put(id, System.currentTimeMillis());
                  }
                  return res;
              }

              static String hm(long sec) {
                  return new SimpleDateFormat("HH:mm", Locale.US).format(new Date(sec * 1000));
              }

              static String dec(String s) {
                  s = s.trim();
                  if (s.length() >= 4 && s.length() % 4 == 0 && s.matches("[A-Za-z0-9+/]+=*")) {
                      try {
                          return new String(Base64.decode(s, Base64.DEFAULT), "UTF-8").trim();
                      } catch (Exception ignored) {
                      }
                  }
                  return s;
              }
          }
          EOF

